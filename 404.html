<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AVP 4.0</title>
  <script>
    // GitHub Pages fallback: unknown routes → app-shell with path preserved when possible.
    // Existing *.html files are served directly by Pages; SW later routes them through shell.
    (function () {
      try {
        var path = location.pathname || '/';
        var baseIdx = path.toLowerCase().indexOf('/learnexcelwithme');
        var base = baseIdx >= 0 ? path.slice(0, baseIdx + '/LearnExcelwithme'.length) + '/' : '/';
        // If this is a real missing asset, show shell home rather than a blank 404
        var target = base + 'app-shell.html';
        // Preserve attempt path as query for diagnostics; shell will open index by default
        location.replace(target + (location.search || '') + (location.hash || ''));
      } catch (e) {
        location.replace('./app-shell.html');
      }
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=./app-shell.html">
    <p><a href="./app-shell.html">Continue to AVP</a></p>
  </noscript>
</head>
<body></body>
</html>
