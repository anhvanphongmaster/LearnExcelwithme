<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=1200, initial-scale=0.32, minimum-scale=0.1, maximum-scale=2, user-scalable=yes">
<title>AVP Office Quest — Duyệt hồ sơ</title>
<script src="supabase-config.js"></script><script type="module" src="supabase-auth.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#102019;color:#1e3528;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.head{color:#f0fff3;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.head h1{font-size:clamp(23px,4vw,34px);margin:0}.head p{color:#bad6c1;margin:5px 0 20px}.panel{background:#fff9eb;border-radius:18px;padding:18px;margin-top:16px;box-shadow:0 12px 36px #0002}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}select,button,textarea{font:inherit;border-radius:10px;padding:10px;border:1px solid #cbd9cc}button{font-weight:800;cursor:pointer;background:#176b46;color:white;border:0}.secondary{background:#e4eee0;color:#244d36}.status{font-weight:800;padding:4px 9px;border-radius:99px;background:#e7f1df}.pending{background:#fff0cb}.rejected{background:#ffe2d9}.row{border-top:1px solid #dce5d8;padding:16px 0}.row:first-child{border-top:0}.rowhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}.field{background:#f1f4e9;padding:10px;border-radius:10px;overflow-wrap:anywhere}.field b{display:block;font-size:12px;color:#637362}.note{width:100%;min-height:68px;margin:8px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#617362;font-size:13px}.error{color:#a3361b;font-weight:700}@media(max-width:600px){.wrap{padding:14px}.grid{grid-template-columns:1fr}.panel{padding:13px}}
</style>
</head>
<body><main class="wrap">
<header class="head"><div><h1>AVP Office Quest</h1><p>Quản lý hồ sơ tuyển dụng trong game</p></div><button class="secondary" id="refresh">Tải lại hồ sơ</button></header>
<section class="panel"><div id="notice">Đang xác minh tài khoản Admin…</div><div class="bar"><label for="filter">Trạng thái:</label><select id="filter"><option value="all">Tất cả</option><option value="pending">Đang chờ</option><option value="approved">Đã duyệt</option><option value="rejected">Cần bổ sung</option></select></div><div id="applications"></div></section>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const labels={qc:'Quản lý chất lượng',data:'Phân tích dữ liệu',hr:'Nhân sự',sales:'Kinh doanh',operations:'Vận hành'};
const statusLabel={pending:'Đang chờ',approved:'Đã duyệt',rejected:'Cần bổ sung'};
let sb=null, rows=[];
async function init(){for(let i=0;i<120;i++){sb=window.avpSupabase;if(sb)break;await new Promise(resolve=>setTimeout(resolve,100))}if(!sb){$('notice').textContent='Không tải được thư viện kết nối Supabase. Hãy kiểm tra mạng rồi tải lại trang.';return}
const {data:{user},error}=await sb.auth.getUser();if(error||!user){$('notice').innerHTML='Bạn cần đăng nhập trước. Mở <a href="admin.html">trang Admin</a> để đăng nhập rồi quay lại đây.';return}
const {data:profile,error:pe}=await sb.from('profiles').select('is_admin').eq('id',user.id).maybeSingle();if(pe||!profile?.is_admin){$('notice').textContent='Tài khoản hiện tại không có quyền Admin.';return}
$('notice').textContent='Đã xác minh quyền Admin.';await load()}
async function load(){ $('applications').textContent='Đang tải…';const {data,error}=await sb.from('office_quest_applications').select('*').order('created_at',{ascending:false});if(error){$('applications').innerHTML='<p class="error">Không tải được: '+esc(error.message)+'</p>';return}rows=data||[];render()}
function render(){const filter=$('filter').value;const list=rows.filter(r=>filter==='all'||r.status===filter);if(!list.length){$('applications').innerHTML='<p class="muted">Chưa có hồ sơ trong trạng thái này.</p>';return}
$('applications').innerHTML=list.map(r=>'<article class="row" data-id="'+esc(r.user_id)+'"><div class="rowhead"><div><strong>'+esc(r.full_name)+'</strong><div class="muted">'+esc(r.desired_role)+' · Nộp '+esc(new Date(r.created_at).toLocaleString('vi-VN'))+'</div></div><span class="status '+esc(r.status)+'">'+esc(statusLabel[r.status]||r.status)+'</span></div><div class="grid"><div class="field"><b>Tuổi / Học vấn</b>'+esc(r.age)+' · '+esc(r.education)+'</div><div class="field"><b>Phòng ban</b>'+esc(labels[r.department]||r.department)+'</div><div class="field"><b>Kỹ năng</b>'+esc(r.skills)+'</div><div class="field"><b>Kinh nghiệm</b>'+esc(r.experience)+'</div><div class="field" style="grid-column:1/-1"><b>Giới thiệu</b>'+esc(r.introduction)+'</div></div><label class="muted" for="note-'+esc(r.user_id)+'">Ghi chú phản hồi của Admin</label><textarea class="note" id="note-'+esc(r.user_id)+'" maxlength="1000">'+esc(r.admin_note||'')+'</textarea><div class="actions"><button data-action="approved" data-user="'+esc(r.user_id)+'">Duyệt hồ sơ</button><button class="secondary" data-action="rejected" data-user="'+esc(r.user_id)+'">Yêu cầu bổ sung</button></div></article>').join('')}
async function review(userId,status){const note=$('note-'+userId)?.value.trim()||'';const {data:{user}}=await sb.auth.getUser();const {error}=await sb.from('office_quest_applications').update({status,admin_note:note,reviewed_by:user.id,reviewed_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('user_id',userId);if(error){alert('Không cập nhật được: '+error.message);return}await load()}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(b)review(b.dataset.user,b.dataset.action)});
$('refresh').addEventListener('click',()=>load());$('filter').addEventListener('change',render);init().catch(e=>{$('notice').textContent='Lỗi: '+e.message});
})();
</script><script src="avp-display-mode.js?v=1"></script></body></html>
