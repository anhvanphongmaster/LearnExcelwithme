<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=1200, initial-scale=0.32, minimum-scale=0.1, maximum-scale=2, user-scalable=yes"><title>AVP Office Quest</title><meta name="theme-color" content="#10251c"><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>try{const c=window.AVP_SUPABASE_CONFIG||{};if(window.supabase&&c.url&&c.publishableKey)window.avpSupabase=window.supabase.createClient(c.url,c.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}catch(e){console.error("Office Quest auth init failed",e)}</script><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at top,#2b6546,#102019 70%);font:15px/1.5 system-ui;color:#20392a}.card{width:min(650px,100%);background:#fff9eb;border:1px solid #9bb99f;border-radius:22px;padding:clamp(20px,4vw,34px);box-shadow:0 24px 90px #0006}.brand{font-weight:950;letter-spacing:.04em;color:#176b46}.card h1{margin:6px 0;font-size:clamp(27px,5vw,38px)}.desc{color:#5f7162;margin:0 0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:800;color:#36523d}.field.full{grid-column:1/-1}input,select,textarea{width:100%;min-width:0;border:1px solid #cbd9c6;border-radius:10px;padding:11px;background:#fffef8;color:#20392a;font:inherit;font-weight:500}textarea{min-height:76px;resize:vertical}button{border:0;border-radius:11px;background:#176b46;color:#fff;padding:13px 16px;font:inherit;font-weight:850;cursor:pointer}.submit{width:100%;margin-top:16px}.status{padding:12px;border-radius:10px;background:#e8f1e1;color:#284c34;margin:14px 0;overflow-wrap:anywhere}.status a{color:#176b46}.hidden{display:none!important}@media(max-width:520px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.card{padding:20px}}
</style></head><body><main class="card"><div class="brand">AVP · OFFICE QUEST</div><h1>Gia nhập văn phòng</h1><p class="desc">Gửi hồ sơ để tham gia AVP Office Quest. Khi hồ sơ được duyệt, bạn có thể vào văn phòng 3D.</p><div id="status" class="status">Đang kết nối hệ thống…</div><form id="cvForm" class="hidden"><div class="grid">
<label class="field">Họ và tên<input name="fullName" required maxlength="100"></label><label class="field">Tuổi<select name="age" required><option value="">Chọn tuổi</option><option value="16">16 tuổi</option><option value="17">17 tuổi</option><option value="18">18 tuổi</option><option value="19">19 tuổi</option><option value="20">20 tuổi</option><option value="21">21 tuổi</option><option value="22">22 tuổi</option><option value="23">23 tuổi</option><option value="24">24 tuổi</option><option value="25">25 tuổi</option><option value="26">26 tuổi</option><option value="27">27 tuổi</option><option value="28">28 tuổi</option><option value="29">29 tuổi</option><option value="30">30 tuổi</option><option value="31">31 tuổi</option><option value="32">32 tuổi</option><option value="33">33 tuổi</option><option value="34">34 tuổi</option><option value="35">35 tuổi</option><option value="36">36 tuổi</option><option value="37">37 tuổi</option><option value="38">38 tuổi</option><option value="39">39 tuổi</option><option value="40">40 tuổi</option><option value="41">41 tuổi</option><option value="42">42 tuổi</option><option value="43">43 tuổi</option><option value="44">44 tuổi</option><option value="45">45 tuổi</option><option value="46">46 tuổi</option><option value="47">47 tuổi</option><option value="48">48 tuổi</option><option value="49">49 tuổi</option><option value="50">50 tuổi</option><option value="51">51 tuổi</option><option value="52">52 tuổi</option><option value="53">53 tuổi</option><option value="54">54 tuổi</option><option value="55">55 tuổi</option><option value="56">56 tuổi</option><option value="57">57 tuổi</option><option value="58">58 tuổi</option><option value="59">59 tuổi</option><option value="60">60 tuổi</option><option value="61">61 tuổi</option><option value="62">62 tuổi</option><option value="63">63 tuổi</option><option value="64">64 tuổi</option><option value="65">65 tuổi</option><option value="66">66 tuổi</option><option value="67">67 tuổi</option><option value="68">68 tuổi</option><option value="69">69 tuổi</option><option value="70">70 tuổi</option><option value="71">71 tuổi</option><option value="72">72 tuổi</option><option value="73">73 tuổi</option><option value="74">74 tuổi</option><option value="75">75 tuổi</option><option value="76">76 tuổi</option><option value="77">77 tuổi</option><option value="78">78 tuổi</option><option value="79">79 tuổi</option><option value="80">80 tuổi</option><option value="81">81 tuổi</option><option value="82">82 tuổi</option><option value="83">83 tuổi</option><option value="84">84 tuổi</option><option value="85">85 tuổi</option><option value="86">86 tuổi</option><option value="87">87 tuổi</option><option value="88">88 tuổi</option><option value="89">89 tuổi</option><option value="90">90 tuổi</option><option value="91">91 tuổi</option><option value="92">92 tuổi</option><option value="93">93 tuổi</option><option value="94">94 tuổi</option><option value="95">95 tuổi</option><option value="96">96 tuổi</option><option value="97">97 tuổi</option><option value="98">98 tuổi</option><option value="99">99 tuổi</option><option value="100">100 tuổi</option></select></label>
<label class="field">Vị trí mong muốn<input name="position" required maxlength="100" placeholder="Ví dụ: Chuyên viên dữ liệu"></label><label class="field">Phòng ban<select name="department" required><option value="qc">Quản lý chất lượng</option><option value="data">Phân tích dữ liệu</option><option value="hr">Nhân sự</option><option value="sales">Kinh doanh</option><option value="operations">Vận hành</option></select></label>
<label class="field">Trình độ học vấn<select name="education" required><option value="">Chọn trình độ học vấn</option><option>Trung học cơ sở</option><option>Trung học phổ thông</option><option>Trung cấp</option><option>Cao đẳng</option><option>Đại học</option><option>Thạc sĩ</option><option>Tiến sĩ</option><option>Khác</option></select></label><label class="field">Kinh nghiệm<input name="experience" maxlength="500" placeholder="Chưa có kinh nghiệm cũng được"></label>
<label class="field full">Kỹ năng<textarea name="skills" required maxlength="2000"></textarea></label><label class="field full">Giới thiệu bản thân<textarea name="about" required maxlength="2000"></textarea></label>
<label class="field full">Chọn nhân vật<div class="grid" style="grid-template-columns:1fr 1fr"><label style="display:flex;gap:10px;align-items:center;border:1px solid #cbd9c6;border-radius:12px;padding:12px;background:#fffef8;cursor:pointer"><input type="radio" name="gender" value="male" checked style="width:auto"><span><strong>Nam</strong><br><small>Nhân vật nam — phong cách công sở lịch sự</small></span></label><label style="display:flex;gap:10px;align-items:center;border:1px solid #cbd9c6;border-radius:12px;padding:12px;background:#fffef8;cursor:pointer"><input type="radio" name="gender" value="female" style="width:auto"><span><strong>Nữ</strong><br><small>Nhân vật nữ — phong cách công sở lịch sự</small></span></label></div></label>
</div><button class="submit" type="submit">Gửi hồ sơ xét duyệt</button></form><button id="enter" class="hidden">Vào văn phòng 3D</button><p class="desc" style="font-size:12px;margin-top:16px">AVP Office Quest · Hồ sơ và quyền truy cập được kiểm tra bằng tài khoản AVP.</p></main>
<script>
(()=>{const $=id=>document.getElementById(id);let sb,user,app;const form=$('cvForm');function msg(t){$('status').textContent=t}function wait(p,ms,label){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(Error(label)),ms))])}
async function init(){try{msg('Đang kết nối hệ thống…');for(let i=0;i<80&&!window.avpSupabase;i++)await new Promise(r=>setTimeout(r,100));sb=window.avpSupabase;if(!sb)throw Error('Không tải được thư viện đăng nhập. Kiểm tra mạng rồi tải lại trang.');const auth=await wait(sb.auth.getUser(),10000,'Máy chủ đăng nhập phản hồi quá lâu. Thử tải lại.');user=auth.data.user;if(!user){msg('Bạn cần đăng nhập website AVP trước khi nộp CV.');return}const res=await wait(sb.from('office_quest_applications').select('status,admin_note,department,full_name').eq('user_id',user.id).maybeSingle(),10000,'Máy chủ hồ sơ phản hồi quá lâu. Thử tải lại.');if(res.error)throw res.error;app=res.data;if(app?.status==='approved'){msg('Hồ sơ đã được duyệt. Bạn có thể vào thẳng văn phòng 3D.');$('enter').classList.remove('hidden');$('enter').onclick=()=>location.href='office-quest-world.html';location.replace('office-quest-world.html');return}if(app?.status==='pending'){msg('Hồ sơ đang chờ duyệt. Bạn không cần gửi lại.');form.classList.add('hidden');return}if(app?.status==='rejected'){msg('Hồ sơ cần bổ sung: '+(app.admin_note||'Hãy kiểm tra lại thông tin rồi liên hệ Admin.'));}else msg('Đăng nhập thành công. Hoàn thành CV để xin vào văn phòng.');form.classList.remove('hidden');if(app?.status==='rejected'){for(const [k,v] of Object.entries({fullName:app.full_name||'',department:app.department||'qc'})){if(form.elements[k])form.elements[k].value=v}}}catch(e){msg('Lỗi kết nối: '+(e.message||e));const b=document.createElement('button');b.textContent='Thử lại';b.onclick=init;$('status').append(' ',b)}}
form.addEventListener('submit',async e=>{e.preventDefault();if(!sb||!user)return;const btn=form.querySelector('button[type=submit]');btn.disabled=true;msg('Đang gửi hồ sơ…');const fd=new FormData(form),v=Object.fromEntries(fd.entries());const row={user_id:user.id,full_name:String(v.fullName).trim(),age:Number(v.age),desired_role:String(v.position).trim(),education:String(v.education).trim(),skills:String(v.skills).trim(),experience:String(v.experience||'').trim(),introduction:String(v.about).trim(),department:v.department,character_gender:v.gender||'male',status:'pending'};try{const res=await wait(sb.from('office_quest_applications').insert(row),12000,'Gửi hồ sơ quá thời gian chờ. Tải lại để kiểm tra trạng thái trước khi gửi lần nữa.');if(res.error)throw res.error;msg('Đã gửi hồ sơ thành công. Chờ Admin duyệt; sau khi duyệt, trang này sẽ đưa bạn thẳng vào văn phòng 3D.');form.classList.add('hidden')}catch(err){msg('Không gửi được hồ sơ: '+(err.message||err));btn.disabled=false}});
init();
})();
</script><script src="avp-display-mode.js?v=1"></script></body></html>
