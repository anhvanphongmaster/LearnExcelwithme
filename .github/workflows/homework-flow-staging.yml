name: Homework Flow Staging

on:
  push:
    branches:
      - feature/homework-flow-v1
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax checks
        run: |
          node --check homework.js
          node --check admin-homework.js
          node --check avp-home-flows-v1.js
          node --check avp-ui-system.js
          node --check practice-youtube-projects.js
          node --check sw.js

      - name: Homework learner contract
        run: |
          grep -q 'youtube_projects_public' homework.js
          grep -q 'Video gốc' homework.js
          grep -q 'File thực hành' homework.js
          grep -q 'Nhiệm vụ' homework.js
          grep -q 'Hint 1' homework.js
          grep -q 'Hint 2' homework.js
          grep -q 'Video chữa' homework.js
          grep -q 'avp_homework_progress_v1' homework.js
          ! grep -Eq 'XP|leaderboard|pass_score|submit_case' homework.js
          grep -q '5–15 phút' homework.html
          echo 'Homework learner contract PASS'

      - name: Admin reuse contract
        run: |
          grep -q 'admin_youtube_projects_list' admin-homework.js
          grep -q 'admin_youtube_project_save' admin-homework.js
          grep -q 'homework:hw' admin-homework.js
          ! grep -Eq 'create table|from\(.homework|homework_insert' admin-homework.js
          grep -q 'admin-homework.js' avp-ui-system.js
          echo 'Admin reuse contract PASS'

      - name: Five-flow navigation contract
        run: |
          test "$(grep -o "data-home-flow" avp-home-flows-v1.js | wc -l)" -eq 1
          grep -q "title:'Kiến thức Excel'" avp-home-flows-v1.js
          grep -q "title:'Học theo YouTube'" avp-home-flows-v1.js
          grep -q "title:'Bài tập về nhà'" avp-home-flows-v1.js
          grep -q "title:'Bài tập tự chấm'" avp-home-flows-v1.js
          grep -q "title:'Case chuyên nghiệp'" avp-home-flows-v1.js
          grep -q 'practice-guides.html' avp-home-flows-v1.js
          grep -q 'homework.html' practice-video.html
          grep -q 'PRACTICE GUIDE · DÙNG CHUNG' practice-video.html
          grep -q 'Làm bài tập của video này' practice-youtube-projects.js
          echo 'Five-flow navigation contract PASS'

      - name: Cache contract
        run: |
          grep -q 'homeworkflow1' sw.js
          grep -q './homework.html' sw.js
          grep -q './homework.js' sw.js
          grep -q './admin-homework.js' sw.js
          grep -q './avp-home-flows-v1.js' sw.js
          grep -q './practice-hub-flow-v1.css' sw.js
          echo 'Cache contract PASS'
