name: Knowledge V2 quality report

on:
  push:
    branches:
      - knowledge/v2-full-curriculum
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report all thin explanations
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const ctx={window:{},console};
          vm.createContext(ctx);
          for(const f of ['knowledge-data-foundation.js','knowledge-data-skills.js','knowledge-data-analysis.js','knowledge-data-advanced.js']) vm.runInContext(fs.readFileSync(f,'utf8'),ctx,{filename:f});
          const lessons=ctx.window.AVPKnowledgeLessons||[];
          const bad=[];
          for(const lesson of lessons){
            for(const [si,section] of (lesson.sections||[]).entries()){
              for(const [qi,q] of (section.questions||[]).entries()){
                if(typeof q.explain!=='string'||q.explain.length<20) bad.push(`${lesson.id}/${si}/${qi} | ${String(q.explain)} | len=${String(q.explain||'').length}`);
              }
            }
          }
          console.log(`TOTAL_LESSONS=${lessons.length}`);
          console.log(`THIN_COUNT=${bad.length}`);
          bad.forEach(x=>console.log(`THIN ${x}`));
          if(bad.length) process.exit(1);
          NODE
