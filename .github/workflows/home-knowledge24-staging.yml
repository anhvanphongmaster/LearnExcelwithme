name: Home Knowledge 24 staging
on:
  push:
    branches: [fix/home-knowledge24-scrolltop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check avp-ui-system.js
          node --check avp-home-knowledge-v2.js
          node --check sw.js
      - name: Homepage curriculum contract
        run: |
          python - <<'PY'
          import re, pathlib
          js=pathlib.Path('avp-home-knowledge-v2.js').read_text(encoding='utf-8')
          ids=re.findall(r"\['(\d{2})','[^']*','([^']+)'",js)
          assert len(ids)==24, len(ids)
          nums=[int(n) for n,_ in ids]
          assert nums==list(range(1,25)), nums
          lesson_ids=[x for _,x in ids]
          assert len(set(lesson_ids))==24
          search=pathlib.Path('global-search.js').read_text(encoding='utf-8')
          missing=[x for x in lesson_ids if x not in search]
          assert not missing, missing
          assert 'Lộ trình 24 bài Excel' in js
          assert '4 chặng × 6 bài' in js
          css=pathlib.Path('avp-home-knowledge-v2.css').read_text(encoding='utf-8')
          assert 'grid-template-columns:repeat(2' in css
          assert '@media(max-width:900px)' in css
          print('Homepage Knowledge contract PASS: 4 cards / 24 lessons')
          PY
      - name: Global back-to-top contract
        run: |
          python - <<'PY'
          import pathlib
          css=pathlib.Path('avp-global-controls-v1.css').read_text(encoding='utf-8')
          assert '.avp-back-to-top' in css
          assert '#backToTop' in css
          assert 'background:rgba(255,255,255,.98)!important' in css
          loader=pathlib.Path('avp-ui-system.js').read_text(encoding='utf-8')
          for token in ['avp-global-controls-v1.css?v=20260910-controls1','avp-home-knowledge-v2.css?v=20260910-homekv2','avp-home-knowledge-v2.js?v=20260910-homekv2']:
              assert token in loader, token
          sw=pathlib.Path('sw.js').read_text(encoding='utf-8')
          for token in ['avp-global-controls-v1.css','avp-home-knowledge-v2.css','avp-home-knowledge-v2.js','v20260910-homeknowledge24']:
              assert token in sw, token
          print('Global control/cache contract PASS')
          PY
      - name: Shared loader coverage audit
        run: |
          python - <<'PY'
          import pathlib
          pages=list(pathlib.Path('.').glob('*.html'))
          simple=[]; ui=[]; gaps=[]
          for p in pages:
              s=p.read_text(encoding='utf-8',errors='ignore')
              if 'simple-nav.js' in s: simple.append(p.name)
              if 'avp-ui-system.js' in s: ui.append(p.name)
              if 'simple-nav.js' in s and 'avp-ui-system.js' not in s: gaps.append(p.name)
          print(f'top-level HTML: {len(pages)}')
          print(f'simple-nav.js: {len(simple)}')
          print(f'avp-ui-system.js: {len(ui)}')
          print('simple-nav without avp-ui:', ', '.join(gaps) if gaps else 'none')
          assert not gaps, f'Back-to-top global white style would miss: {gaps}'
          home=pathlib.Path('index.html').read_text(encoding='utf-8')
          assert 'avp-ui-system.js' in home
          PY
