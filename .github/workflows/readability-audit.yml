name: Readability Audit

on:
  push:
    branches: [ui-readability-hardening-v2]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Static syntax and CSS sanity
        run: |
          set -e
          for f in *.js; do node --check "$f" >/dev/null; done
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('.').glob('*.css'):
              s=p.read_text(encoding='utf-8',errors='ignore')
              if s.count('{') != s.count('}'):
                  raise SystemExit(f'unbalanced CSS: {p}')
          print('static syntax PASS')
          PY

      - name: Install browser audit runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium

      - name: Browser readability audit
        run: |
          python3 -m http.server 4173 >/tmp/avp-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat > /tmp/audit.js <<'JS'
          const { chromium } = require('playwright');
          const fs=require('fs');
          const files=fs.readdirSync('.').filter(x=>x.endsWith('.html')).sort();
          const coreMobile=new Set(['index.html','admin.html','professional-track.html','practice-video.html','practice-tiktok.html','practice-youtube.html','practice-grader.html','tools-library.html','tools-center.html','community.html']);

          function rgb(s){
            const m=String(s||'').match(/rgba?\((\d+(?:\.\d+)?)[, ]+(\d+(?:\.\d+)?)[, ]+(\d+(?:\.\d+)?)(?:[, /]+([\d.]+))?\)/i);
            return m?[+m[1],+m[2],+m[3],m[4]===undefined?1:+m[4]]:null;
          }
          function lum(c){return c.slice(0,3).map(v=>v/255).map(v=>v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0)}
          function ratio(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}

          async function runView(page,file,w,h){
            await page.setViewportSize({width:w,height:h});
            let navError='';
            try{await page.goto(`http://127.0.0.1:4173/${file}`,{waitUntil:'domcontentloaded',timeout:8000});}catch(e){navError=e.message.split('\n')[0]}
            await page.waitForTimeout(250);
            const data=await page.evaluate(({w})=>{
              const visible=el=>{
                const cs=getComputedStyle(el),r=el.getBoundingClientRect();
                return cs.display!=='none'&&cs.visibility!=='hidden'&&r.width>1&&r.height>1;
              };
              const bgFor=el=>{
                let n=el;
                while(n&&n!==document.documentElement){
                  const cs=getComputedStyle(n);
                  if(cs.backgroundImage&&cs.backgroundImage!=='none')return {gradient:true,color:cs.backgroundColor};
                  const c=cs.backgroundColor;
                  if(c&&!/rgba\([^)]*,\s*0(?:\.0+)?\)$/.test(c)&&c!=='transparent')return {gradient:false,color:c};
                  n=n.parentElement;
                }
                return {gradient:false,color:getComputedStyle(document.body).backgroundColor};
              };
              const controls=[...document.querySelectorAll('button,a,input,select,textarea,label,[role="button"],[role="tab"],[class*="status"],[class*="state"],[class*="notice"],[class*="message"],[class*="feedback"]')].filter(visible);
              const samples=controls.slice(0,1800).map(el=>{
                const cs=getComputedStyle(el),b=bgFor(el),txt=(el.innerText||el.value||el.getAttribute('placeholder')||el.getAttribute('aria-label')||'').trim().slice(0,100);
                let op=1,n=el;while(n&&n!==document.documentElement){op*=Number(getComputedStyle(n).opacity||1);n=n.parentElement}
                return {tag:el.tagName,cls:el.className||'',id:el.id||'',txt,color:cs.color,bg:b.color,gradient:b.gradient,opacity:op,disabled:!!el.disabled||el.getAttribute('aria-disabled')==='true'};
              });
              const overlaps=[];
              document.querySelectorAll('.home-more-card').forEach(card=>{
                const a=card.querySelector(':scope > strong'),b=card.querySelector(':scope > small');
                if(!a||!b||!visible(a)||!visible(b))return;
                const x=a.getBoundingClientRect(),y=b.getBoundingClientRect();
                if(x.bottom>y.top+1)overlaps.push({card:(a.textContent||'').trim(),bottom:x.bottom,metaTop:y.top});
              });
              const clipped=[];
              controls.forEach(el=>{
                const cs=getComputedStyle(el);if(!visible(el))return;
                if((el.scrollHeight>el.clientHeight+3||el.scrollWidth>el.clientWidth+3)&&['hidden','clip'].includes(cs.overflow))clipped.push({tag:el.tagName,id:el.id||'',cls:String(el.className||'').slice(0,80),txt:(el.innerText||'').trim().slice(0,80)});
              });
              const upload=document.querySelector('.apt-grader-upload');
              return {
                pageOverflow:document.documentElement.scrollWidth>w+5,
                scrollWidth:document.documentElement.scrollWidth,
                samples,overlaps,clipped:clipped.slice(0,50),
                upload:upload&&visible(upload)?{color:getComputedStyle(upload.querySelector('span')||upload).color,bg:getComputedStyle(upload).backgroundColor,opacity:getComputedStyle(upload).opacity}:null
              };
            },{w});
            const low=[],faint=[];
            for(const s of data.samples){
              if(!s.txt)continue;
              if(s.opacity<.60)faint.push(s);
              if(s.gradient)continue;
              const a=rgb(s.color),b=rgb(s.bg);if(!a||!b||a[3]<.9||b[3]<.9)continue;
              const r=ratio(a,b);if(r<3.2)low.push({...s,ratio:+r.toFixed(2)});
            }
            let uploadRatio=null;
            if(data.upload){const a=rgb(data.upload.color),b=rgb(data.upload.bg);if(a&&b)uploadRatio=+ratio(a,b).toFixed(2)}
            return {file,w,navError,overflow:data.pageOverflow,low:low.slice(0,20),faint:faint.slice(0,20),overlaps:data.overlaps,clipped:data.clipped,uploadRatio};
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({serviceWorkers:'block'});
            await ctx.route('**/*',route=>{
              const u=route.request().url();
              if(u.startsWith('http://127.0.0.1:4173/'))route.continue();else route.abort();
            });
            const page=await ctx.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(String(e.message||e)));
            const reports=[];
            for(const f of files)reports.push(await runView(page,f,1366,900));
            for(const f of coreMobile)if(files.includes(f))reports.push(await runView(page,f,390,844));
            await browser.close();

            const critical=[];
            for(const r of reports){
              if(r.navError)critical.push(`${r.file}@${r.w}: navigation ${r.navError}`);
              if(r.overlaps.length)critical.push(`${r.file}@${r.w}: home text overlap ${JSON.stringify(r.overlaps)}`);
              if(r.uploadRatio!==null&&r.uploadRatio<4.5)critical.push(`${r.file}@${r.w}: grader upload contrast ${r.uploadRatio}`);
              if(r.overflow&&r.w===390)critical.push(`${r.file}@mobile: horizontal overflow`);
            }
            const lowCount=reports.reduce((n,r)=>n+r.low.length,0);
            const faintCount=reports.reduce((n,r)=>n+r.faint.length,0);
            console.log(`AUDITED ${reports.length} page/view combinations (${files.length} HTML files)`);
            console.log(`LOW-CONTRAST SAMPLES(<3.2): ${lowCount}; FAINT SAMPLES(opacity<.60): ${faintCount}`);
            const interesting=reports.filter(r=>r.low.length||r.faint.length||r.clipped.length||r.overlaps.length||r.overflow);
            for(const r of interesting.slice(0,30)){
              console.log(`\n[${r.file}@${r.w}] low=${r.low.length} faint=${r.faint.length} clipped=${r.clipped.length} overflow=${r.overflow}`);
              if(r.low.length)console.log(' LOW',JSON.stringify(r.low.slice(0,5)));
              if(r.faint.length)console.log(' FAINT',JSON.stringify(r.faint.slice(0,5)));
              if(r.clipped.length)console.log(' CLIPPED',JSON.stringify(r.clipped.slice(0,5)));
            }
            if(critical.length){console.error('\nCRITICAL');critical.forEach(x=>console.error(x));process.exit(1)}
            console.log('\nCRITICAL READABILITY CHECKS PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/audit.js
