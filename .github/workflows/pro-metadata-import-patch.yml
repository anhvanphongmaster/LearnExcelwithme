name: Pro metadata import patch

on:
  push:
    branches:
      - pro/case-metadata-import

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python tmp-pro-metadata-import.py
      - name: Validate
        run: |
          node --check admin-professional-track.js
          grep -q "aptCaseMetadataFile" admin.html
          grep -q "Pro metadata package import V1" admin-professional-track.js
          grep -q "Phát hành.*OFF" admin-professional-track.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-professional-track.js admin-professional-track.css admin.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Pro: add safe Case metadata JSON import"
          git push origin HEAD:${GITHUB_REF_NAME}
