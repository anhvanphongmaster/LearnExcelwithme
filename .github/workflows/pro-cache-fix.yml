name: Pro cache fix staging
on:
  push:
    branches: [pro-cache-runtime-audit]
    paths: ['.github/workflows/pro-cache-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump Professional asset versions
        run: |
          python - <<'PY'
          from pathlib import Path
          changes = {
            'admin.html': [
              ('admin-professional-track.css?v=20260908-private-student1','admin-professional-track.css?v=20260909-pro-system1'),
              ('admin-professional-track.js?v=20260908-private-student1','admin-professional-track.js?v=20260909-pro-system1'),
            ],
            'professional-access.html': [
              ('professional-access.js?v=20260908-rolefix1','professional-access.js?v=20260909-pro-system1'),
            ],
            'sw.js': [
              ('learnexcel-assets-v20260908-routefix1','learnexcel-assets-v20260909-prosystem1'),
            ],
          }
          for name, reps in changes.items():
            p=Path(name); s=p.read_text(encoding='utf-8')
            old=s
            for a,b in reps:
              if a not in s: raise SystemExit(f'missing expected token in {name}: {a}')
              s=s.replace(a,b)
            if s==old: raise SystemExit(f'no change: {name}')
            p.write_text(s,encoding='utf-8')
          PY
      - name: Validate changed files
        run: |
          grep -q 'admin-professional-track.js?v=20260909-pro-system1' admin.html
          grep -q 'professional-access.js?v=20260909-pro-system1' professional-access.html
          grep -q 'learnexcel-assets-v20260909-prosystem1' sw.js
          node --check sw.js
      - name: Commit patch
        run: |
          git config user.name 'anhvanphongmaster'
          git config user.email 'anhvanphongmaster@gmail.com'
          git add admin.html professional-access.html sw.js
          git commit -m 'Pro: refresh asset cache versions after system V1' || exit 0
          git push
