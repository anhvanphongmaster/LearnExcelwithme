name: Pro Sales Handbook CI

on:
  push:
    branches:
      - pro/finish-sales-handbook
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check sales-handbook-data.js
          node --check sales-handbook.js
          node --check professional-reader-gate.js
      - name: Content contract
        run: |
          node <<'NODE'
          global.window = {};
          require('./sales-handbook-data.js');
          const book = global.window.AVPSalesHandbook;
          if (!book || !Array.isArray(book.chapters)) throw new Error('book_missing');
          if (book.chapters.length !== 10) throw new Error(`expected_10_chapters_got_${book.chapters.length}`);
          const ids = new Set();
          for (const chapter of book.chapters) {
            if (!chapter.id || ids.has(chapter.id)) throw new Error(`duplicate_or_missing_id:${chapter.id}`);
            ids.add(chapter.id);
            if (!chapter.title || !chapter.summary || !Array.isArray(chapter.sections) || chapter.sections.length < 5) {
              throw new Error(`chapter_contract:${chapter.id}`);
            }
            for (const section of chapter.sections) {
              if (!section.type || !section.title) throw new Error(`section_contract:${chapter.id}`);
              if (section.type === 'checkpoint') {
                if (!Array.isArray(section.options) || section.options.length < 2) throw new Error(`checkpoint_options:${chapter.id}`);
                if (!Number.isInteger(section.answer) || section.answer < 0 || section.answer >= section.options.length) throw new Error(`checkpoint_answer:${chapter.id}`);
                if (!section.explain) throw new Error(`checkpoint_explain:${chapter.id}`);
              }
            }
          }
          const expected = [
            'data-grain','keys-dimensions','sales-kpis','revenue-control','aov-upt-asp',
            'mix-variance','target-allocation','achievement-gap-runrate','traffic-conversion','handover-storytelling'
          ];
          if (expected.some(id => !ids.has(id))) throw new Error('chapter_mapping_incomplete');
          console.log(`PASS: ${book.chapters.length} handbook chapters validated`);
          NODE
      - name: HTML asset contract
        run: |
          grep -q 'sales-handbook-data.js?v=20260909-salespro2' sales-handbook.html
          grep -q 'professional-reader-gate.js?v=20260909-pro-system1' sales-handbook.html
          grep -q 'professional-readability-v3.css?v=20260909-proread3' sales-handbook.html
