name: Readability Audit V2

on:
  push:
    branches: [ui-readability-hardening-v2]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax and CSS sanity
        run: |
          set -e
          for f in *.js; do node --check "$f" >/dev/null; done
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('.').glob('*.css'):
              s=p.read_text(encoding='utf-8',errors='ignore')
              assert s.count('{')==s.count('}'), f'unbalanced CSS: {p}'
          print('static syntax PASS')
          PY
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium
      - name: Audit all root HTML pages
        run: |
          python3 -m http.server 4173 >/tmp/avp-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat > audit-readability.js <<'JS'
          const { chromium } = require('playwright');
          const fs=require('fs');
          const files=fs.readdirSync('.').filter(x=>x.endsWith('.html')).sort();
          const mobile=new Set(['index.html','admin.html','professional-track.html','practice-video.html','practice-tiktok.html','practice-youtube.html','practice-grader.html','tools-library.html','tools-center.html','community.html']);
          function rgb(s){const m=String(s||'').match(/rgba?\((\d+(?:\.\d+)?)[, ]+(\d+(?:\.\d+)?)[, ]+(\d+(?:\.\d+)?)(?:[, /]+([\d.]+))?\)/i);return m?[+m[1],+m[2],+m[3],m[4]===undefined?1:+m[4]]:null}
          function lum(c){return c.slice(0,3).map(v=>v/255).map(v=>v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0)}
          function ratio(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
          async function audit(page,file,w,h){
            await page.setViewportSize({width:w,height:h});
            let navError='';try{await page.goto(`http://127.0.0.1:4173/${file}`,{waitUntil:'domcontentloaded',timeout:8000})}catch(e){navError=e.message.split('\n')[0]}
            await page.waitForTimeout(220);
            const data=await page.evaluate(({w})=>{
              const vis=el=>{const c=getComputedStyle(el),r=el.getBoundingClientRect();return c.display!=='none'&&c.visibility!=='hidden'&&r.width>1&&r.height>1};
              const bg=el=>{for(let n=el;n&&n!==document.documentElement;n=n.parentElement){const c=getComputedStyle(n);if(c.backgroundImage&&c.backgroundImage!=='none')return {gradient:true,color:c.backgroundColor};if(c.backgroundColor&&c.backgroundColor!=='transparent'&&!/rgba\([^)]*,\s*0(?:\.0+)?\)$/.test(c.backgroundColor))return {gradient:false,color:c.backgroundColor}}return {gradient:false,color:getComputedStyle(document.body).backgroundColor}};
              const sel='button,a,input,select,textarea,label,[role="button"],[role="tab"],[class*="status"],[class*="state"],[class*="notice"],[class*="message"],[class*="feedback"]';
              const samples=[...document.querySelectorAll(sel)].filter(vis).slice(0,2200).map(el=>{const c=getComputedStyle(el),b=bg(el),txt=(el.innerText||el.value||el.getAttribute('placeholder')||el.getAttribute('aria-label')||'').trim().slice(0,100);let op=1;for(let n=el;n&&n!==document.documentElement;n=n.parentElement)op*=Number(getComputedStyle(n).opacity||1);return {tag:el.tagName,id:el.id||'',cls:String(el.className||'').slice(0,100),txt,color:c.color,bg:b.color,gradient:b.gradient,opacity:op,disabled:!!el.disabled||el.getAttribute('aria-disabled')==='true'}});
              const overlaps=[];document.querySelectorAll('.home-more-card').forEach(card=>{const a=card.querySelector(':scope > strong'),b=card.querySelector(':scope > small');if(!a||!b||!vis(a)||!vis(b))return;const x=a.getBoundingClientRect(),y=b.getBoundingClientRect();if(x.bottom>y.top+1)overlaps.push({title:(a.textContent||'').trim(),bottom:x.bottom,metaTop:y.top})});
              const upload=document.querySelector('.apt-grader-upload');
              return {overflow:document.documentElement.scrollWidth>w+5,samples,overlaps,upload:upload&&vis(upload)?{color:getComputedStyle(upload.querySelector('span')||upload).color,bg:getComputedStyle(upload).backgroundColor}:null};
            },{w});
            const low=[],faint=[];for(const s of data.samples){if(!s.txt)continue;if(s.opacity<.60)faint.push(s);if(s.gradient)continue;const a=rgb(s.color),b=rgb(s.bg);if(!a||!b||a[3]<.9||b[3]<.9)continue;const r=ratio(a,b);if(r<3.2)low.push({...s,ratio:+r.toFixed(2)})}
            let uploadRatio=null;if(data.upload){const a=rgb(data.upload.color),b=rgb(data.upload.bg);if(a&&b)uploadRatio=+ratio(a,b).toFixed(2)}
            return {file,w,navError,overflow:data.overflow,overlaps:data.overlaps,uploadRatio,low:low.slice(0,25),faint:faint.slice(0,25)};
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});const ctx=await browser.newContext({serviceWorkers:'block'});
            await ctx.route('**/*',r=>r.request().url().startsWith('http://127.0.0.1:4173/')?r.continue():r.abort());
            const page=await ctx.newPage(),reports=[];
            for(const f of files)reports.push(await audit(page,f,1366,900));
            for(const f of mobile)if(files.includes(f))reports.push(await audit(page,f,390,844));
            await browser.close();
            const critical=[];for(const r of reports){if(r.navError)critical.push(`${r.file}@${r.w}: nav ${r.navError}`);if(r.overlaps.length)critical.push(`${r.file}@${r.w}: overlaps ${JSON.stringify(r.overlaps)}`);if(r.uploadRatio!==null&&r.uploadRatio<4.5)critical.push(`${r.file}@${r.w}: upload contrast ${r.uploadRatio}`);if(r.overflow&&r.w===390)critical.push(`${r.file}@mobile: horizontal overflow`)}
            const lowN=reports.reduce((n,r)=>n+r.low.length,0),faintN=reports.reduce((n,r)=>n+r.faint.length,0);
            console.log(`AUDITED ${reports.length} views across ${files.length} HTML files; low=${lowN}; faint=${faintN}`);
            reports.filter(r=>r.low.length||r.faint.length||r.overlaps.length||r.overflow).slice(0,35).forEach(r=>{console.log(`\n[${r.file}@${r.w}] low=${r.low.length} faint=${r.faint.length} overlap=${r.overlaps.length} overflow=${r.overflow}`);if(r.low.length)console.log('LOW',JSON.stringify(r.low.slice(0,6)));if(r.faint.length)console.log('FAINT',JSON.stringify(r.faint.slice(0,6)))});
            if(critical.length){console.error('\nCRITICAL');critical.forEach(x=>console.error(x));process.exit(1)}
            console.log('CRITICAL READABILITY PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node audit-readability.js
