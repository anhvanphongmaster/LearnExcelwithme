name: Knowledge V2 final audit

on:
  push:
    branches:
      - knowledge/v2-full-curriculum
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          node --check knowledge-data-foundation.js
          node --check knowledge-data-skills.js
          node --check knowledge-data-analysis.js
          node --check knowledge-data-advanced.js
          node --check knowledge-v2.js
          node --check skill-map.js
          node --check global-search.js
          node --check sw.js

      - name: Curriculum and question contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const ctx={window:{},console};
          vm.createContext(ctx);
          const dataFiles=['knowledge-data-foundation.js','knowledge-data-skills.js','knowledge-data-analysis.js','knowledge-data-advanced.js'];
          dataFiles.forEach(f=>vm.runInContext(fs.readFileSync(f,'utf8'),ctx,{filename:f}));
          const lessons=ctx.window.AVPKnowledgeLessons||[];
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const zones=['foundation','skills','analysis','advanced'];
          assert(lessons.length===24,`Expected 24 lessons, got ${lessons.length}`);
          assert(new Set(lessons.map(x=>x.id)).size===24,'Lesson IDs must be unique');
          assert(new Set(lessons.map(x=>x.order)).size===24,'Lesson orders must be unique');
          assert(Math.min(...lessons.map(x=>x.order))===1&&Math.max(...lessons.map(x=>x.order))===24,'Orders must span 1..24');
          zones.forEach(zone=>assert(lessons.filter(x=>x.zone===zone).length===6,`${zone} must have 6 lessons`));
          const ids=new Set(lessons.map(x=>x.id));
          let sectionCount=0,questionCount=0;
          for(const lesson of lessons){
            assert(lesson.title&&lesson.hook&&lesson.short,`${lesson.id}: missing title/hook/short`);
            assert(Array.isArray(lesson.outcomes)&&lesson.outcomes.length>=3,`${lesson.id}: outcomes too thin`);
            assert(Array.isArray(lesson.useCases)&&lesson.useCases.length>=3,`${lesson.id}: useCases too thin`);
            assert(Array.isArray(lesson.sections)&&lesson.sections.length>=5,`${lesson.id}: need >=5 sections`);
            (lesson.prerequisites||[]).forEach(id=>assert(ids.has(id),`${lesson.id}: missing prerequisite ${id}`));
            sectionCount+=lesson.sections.length;
            lesson.sections.forEach((section,si)=>{
              assert(section.title&&section.why,`${lesson.id}/${si}: section lacks title/why`);
              assert(Array.isArray(section.body)&&section.body.length>=2,`${lesson.id}/${si}: body too thin`);
              assert(Array.isArray(section.questions)&&section.questions.length>=2,`${lesson.id}/${si}: need >=2 questions`);
              questionCount+=section.questions.length;
              section.questions.forEach((q,qi)=>{
                assert(q.q&&Array.isArray(q.options)&&q.options.length>=2,`${lesson.id}/${si}/${qi}: invalid question`);
                assert(Number.isInteger(q.answer)&&q.answer>=0&&q.answer<q.options.length,`${lesson.id}/${si}/${qi}: invalid answer`);
                assert(typeof q.explain==='string'&&q.explain.length>=20,`${lesson.id}/${si}/${qi}: explanation too thin`);
              });
            });
          }
          console.log(`PASS curriculum: ${lessons.length} lessons / ${sectionCount} sections / ${questionCount} questions`);
          NODE

      - name: Reader and Skill Map contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const reader=fs.readFileSync('knowledge.html','utf8');
          const readerJs=fs.readFileSync('knowledge-v2.js','utf8');
          const mapHtml=fs.readFileSync('skill-map.html','utf8');
          const mapJs=fs.readFileSync('skill-map.js','utf8');
          const mapCss=fs.readFileSync('skill-map.css','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          assert(!/course-engine\.js|learning-experience-v2\.js|data-lx-manual|Đánh dấu đã học|Đánh dấu đã đọc/i.test(reader),'Reader must not load legacy completion UX');
          assert(!/XPKEY|QKEY|PKEY|unlocked\(|locked-zone|Chưa mở khóa|300 XP/.test(mapJs),'Skill Map must not hard-lock or depend on XP');
          assert(/grid-template-columns:repeat\(2,minmax\(0,1fr\)\)/.test(mapCss),'Desktop Skill Map must be equal 2-column layout');
          assert((mapHtml.match(/knowledge-data-/g)||[]).length===4,'Skill Map must load four curriculum data files');
          assert((reader.match(/knowledge-data-/g)||[]).length===4,'Reader must load four curriculum data files');
          assert(readerJs.includes("correct?'good':'bad'"),'Question feedback must distinguish correct and wrong states');
          assert(readerJs.includes("classList.toggle('wrong'"),'Wrong answer highlighting missing');
          assert(readerJs.includes("classList.toggle('correct'"),'Correct answer highlighting missing');
          for(const asset of ['./knowledge.html','./knowledge-v2.js','./knowledge-v2.css','./knowledge-data-foundation.js','./knowledge-data-skills.js','./knowledge-data-analysis.js','./knowledge-data-advanced.js']) assert(sw.includes(asset),`Service worker missing ${asset}`);
          console.log('PASS reader/map/service-worker contract');
          NODE

      - name: Global Search regression contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const search=fs.readFileSync('global-search.js','utf8');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const knowledgeIds=[...search.matchAll(/K\('([^']+)'/g)].map(m=>m[1]);
          assert(knowledgeIds.length===24,`Global search needs 24 Knowledge entries, got ${knowledgeIds.length}`);
          assert(new Set(knowledgeIds).size===24,'Knowledge search IDs must be unique');
          const preserved=[
            ['Excel Playground','playground.html'],
            ['Thành tích & Nhiệm vụ','achievements.html'],
            ['Practice Lab','practice-lab.html'],
            ['Master Excel (áp dụng cho cả mobile)','excel-mobile.html'],
            ['Tài liệu thực hành','practice-video.html'],
            ['Kho Tool','tools-library.html'],
            ['Bài tập theo video TikTok','practice-tiktok.html'],
            ['Hồ sơ người học','profile.html'],
            ['Tài liệu tham khảo','tai-lieu-tham-khao.html']
          ];
          preserved.forEach(([title,file])=>{
            assert(search.includes(`title:'${title}'`),`Global Search lost ${title}`);
            assert(search.includes(`url:'${file}'`),`Global Search lost route ${file}`);
            assert(fs.existsSync(file),`Search target missing: ${file}`);
          });
          for(const keyword of ['xlookup','pivot','pareto','power query','vba']) assert(search.toLowerCase().includes(keyword),`Knowledge keyword missing: ${keyword}`);
          console.log('PASS global-search regression contract');
          NODE

      - name: Product scope contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const required=['knowledge.html','knowledge-v2.js','knowledge-v2.css','knowledge-data-foundation.js','knowledge-data-skills.js','knowledge-data-analysis.js','knowledge-data-advanced.js','skill-map.html','skill-map.js','skill-map.css','global-search.js','sw.js'];
          required.forEach(f=>{if(!fs.existsSync(f))throw new Error(`Missing product file ${f}`)});
          console.log(`PASS product scope: ${required.length} required files present`);
          NODE
