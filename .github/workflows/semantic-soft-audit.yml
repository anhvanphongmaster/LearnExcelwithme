name: Semantic Soft Audit

on:
  push:
    branches: [ui-semantic-soft-v1]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check avp-ui-system.js
      - name: Semantic CSS sanity
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('avp-semantic-soft.css').read_text(encoding='utf-8')
          assert s.count('{')==s.count('}'), 'unbalanced CSS braces'
          required=[
            '--avp-sem-info-bg','--avp-sem-success-bg','--avp-sem-warn-bg',
            '--avp-sem-danger-bg','--avp-sem-draft-bg',
            '.pro-flow-path span.active','.pro-case-submission-state.graded',
            '.pro-case-next:has(>strong)','[data-pro-case-submit]'
          ]
          for item in required:
            assert item in s, f'missing {item}'
          print('semantic CSS sanity PASS')
          PY
      - name: Loader sanity
        run: |
          grep -F "avp-semantic-soft.css?v=20260909-semsoft1" avp-ui-system.js
          grep -F "ensureCss();ensureSemanticCss();" avp-ui-system.js
