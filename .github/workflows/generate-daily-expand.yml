name: Generate daily expand workbooks

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate-daily-expand.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build unique daily workbooks
        run: |
          pip install openpyxl
          python scripts/gen_daily.py
      - name: Commit
        run: |
          git config user.name anhvanphong
          git config user.email anhvanphongmaster@gmail.com
          git add downloads/daily-co-ban.xlsx downloads/daily-trung-cap.xlsx downloads/daily-nang-cao.xlsx downloads/daily-case.xlsx
          git diff --cached --quiet && echo none && exit 0
          git commit -m "Rebuild daily-expand workbooks: unique sheets + HuongDan"
          git push
