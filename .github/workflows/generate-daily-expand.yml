name: Generate daily lesson workbooks

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate-daily-expand.yml'
      - 'scripts/build_daily_xlsx.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build workbooks from catalog data
        run: |
          pip install openpyxl
          python scripts/build_daily_xlsx.py
      - name: Commit files
        run: |
          git config user.name anhvanphong
          git config user.email anhvanphongmaster@gmail.com
          mkdir -p downloads/daily
          git add downloads/daily/*.xlsx || true
          git diff --cached --quiet && echo none && exit 0
          git commit -m "Sinh file thuc hanh tung bai Hoc hom nay"
          git push
