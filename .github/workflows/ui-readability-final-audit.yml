name: UI Readability Final Audit

on:
  push:
    branches: [ui-readability-final-main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax sanity
        run: |
          set -e
          for f in *.js; do node --check "$f" >/dev/null; done
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('.').glob('*.css'):
              s=p.read_text(encoding='utf-8',errors='ignore')
              assert s.count('{')==s.count('}'), f'unbalanced CSS: {p}'
          print('STATIC PASS')
          PY
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium
      - name: Full reduced-motion readability audit
        run: |
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          cat > final-audit.js <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          const files=fs.readdirSync('.').filter(f=>f.endsWith('.html')).sort();
          const mobile=new Set(['index.html','admin.html','professional-track.html','practice-video.html','practice-tiktok.html','practice-youtube.html','practice-grader.html','tools-library.html','tools-center.html','community.html']);
          const rgb=s=>{const m=String(s||'').match(/rgba?\((\d+(?:\.\d+)?)[, ]+(\d+(?:\.\d+)?)[, ]+(\d+(?:\.\d+)?)(?:[, /]+([\d.]+))?\)/i);return m?[+m[1],+m[2],+m[3],m[4]===undefined?1:+m[4]]:null};
          const lum=c=>c.slice(0,3).map(v=>v/255).map(v=>v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0);
          const contrast=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
          async function scan(page,file,w,h){
            await page.setViewportSize({width:w,height:h});
            await page.goto(`http://127.0.0.1:4173/${file}`,{waitUntil:'domcontentloaded',timeout:8000});
            await page.evaluate(async()=>{for(let y=0;y<document.documentElement.scrollHeight;y+=Math.max(360,innerHeight*.7)){scrollTo(0,y);await new Promise(r=>setTimeout(r,60))}scrollTo(0,0)});
            await page.waitForTimeout(800);
            return page.evaluate(({w})=>{
              const vis=e=>{const c=getComputedStyle(e),r=e.getBoundingClientRect();return c.display!=='none'&&c.visibility!=='hidden'&&r.width>1&&r.height>1};
              const bg=e=>{for(let n=e;n&&n!==document.documentElement;n=n.parentElement){const c=getComputedStyle(n);if(c.backgroundImage&&c.backgroundImage!=='none')return {gradient:true,color:c.backgroundColor};const x=c.backgroundColor;if(x&&x!=='transparent'&&!/rgba\([^)]*,\s*0(?:\.0+)?\)$/.test(x))return {gradient:false,color:x}}return {gradient:false,color:getComputedStyle(document.body).backgroundColor}};
              const sel='button,a,input,select,textarea,label,[role="button"],[role="tab"],[class*="status"],[class*="state"],[class*="notice"],[class*="message"],[class*="feedback"]';
              const samples=[...document.querySelectorAll(sel)].filter(vis).map(e=>{const c=getComputedStyle(e),b=bg(e);let op=1;for(let n=e;n&&n!==document.documentElement;n=n.parentElement)op*=Number(getComputedStyle(n).opacity||1);return {id:e.id||'',cls:String(e.className||'').slice(0,100),txt:(e.innerText||e.value||e.getAttribute('placeholder')||e.getAttribute('aria-label')||'').trim().slice(0,100),color:c.color,bg:b.color,gradient:b.gradient,opacity:op}});
              const overlaps=[];document.querySelectorAll('.home-more-card').forEach(c=>{const a=c.querySelector(':scope>strong'),b=c.querySelector(':scope>small');if(a&&b&&vis(a)&&vis(b)&&a.getBoundingClientRect().bottom>b.getBoundingClientRect().top+1)overlaps.push((a.textContent||'').trim())});
              const toc=[...document.querySelectorAll('.avp-learning-toc a')].filter(vis).map(a=>({color:getComputedStyle(a).color,bg:bg(a).color,gradient:bg(a).gradient,text:a.textContent.trim()}));
              return {samples,overlaps,toc,overflow:document.documentElement.scrollWidth>w+5};
            },{w});
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({serviceWorkers:'block',reducedMotion:'reduce'});
            await ctx.route('**/*',r=>r.request().url().startsWith('http://127.0.0.1:4173/')?r.continue():r.abort());
            const p=await ctx.newPage(),reports=[];
            for(const f of files)reports.push({file:f,w:1366,...await scan(p,f,1366,900)});
            for(const f of mobile)if(files.includes(f))reports.push({file:f,w:390,...await scan(p,f,390,844)});

            await p.setViewportSize({width:1366,height:900});
            await p.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded'});await p.waitForTimeout(400);
            const home=await p.evaluate(()=>{const t=document.getElementById('homeContinueTitle'),m=document.getElementById('homeContinueMeta');if(t)t.textContent='Tiếp tục: VBA / Macro tự động hóa';if(m)m.textContent='Bài 13/14 • vừa xem: Excel cơ bản';const cards=[...document.querySelectorAll('.home-path-more--5 .home-more-card')],a=t?.getBoundingClientRect(),b=m?.getBoundingClientRect();return {count:cards.length,overlap:!!(a&&b&&a.bottom>b.top+1)}});

            await p.goto('http://127.0.0.1:4173/admin.html',{waitUntil:'domcontentloaded'});await p.waitForTimeout(400);
            const admin=await p.evaluate(()=>{const w=document.createElement('div');w.className='apt-form-grid';w.style.cssText='display:block!important;position:fixed;left:20px;top:20px;z-index:999999;background:#fff;padding:10px';w.innerHTML='<div class="apt-grader-box"><label class="apt-grader-upload"><input type="file"><span>Chọn file đáp án ẩn</span></label><button disabled>Xóa đáp án ẩn</button></div>';document.body.appendChild(w);const u=w.querySelector('.apt-grader-upload'),s=u.querySelector('span'),d=w.querySelector('button');return {upload:{color:getComputedStyle(s).color,bg:getComputedStyle(u).backgroundColor},disabled:{color:getComputedStyle(d).color,bg:getComputedStyle(d).backgroundColor}}});
            await browser.close();

            const issues=[];let low=0,faint=0;
            for(const r of reports){
              if(r.overlaps.length)issues.push(`${r.file}@${r.w}: card overlap ${r.overlaps.join('|')}`);
              if(r.w===390&&r.overflow)issues.push(`${r.file}@mobile: horizontal overflow`);
              for(const s of r.samples){
                if(!s.txt||s.id==='avpEdgeMain'||s.cls.includes('avp-edge-main'))continue;
                if(s.opacity<.58){faint++;issues.push(`${r.file}@${r.w}: faint ${s.txt} opacity=${s.opacity.toFixed(2)}`);continue}
                if(s.gradient)continue;
                const a=rgb(s.color),b=rgb(s.bg);if(a&&b&&a[3]>=.9&&b[3]>=.9){const x=contrast(a,b);if(x<3.0){low++;issues.push(`${r.file}@${r.w}: contrast ${x.toFixed(2)} ${s.txt}`)}}
              }
              for(const t of r.toc){if(t.gradient)continue;const a=rgb(t.color),b=rgb(t.bg);if(a&&b&&contrast(a,b)<4.5)issues.push(`${r.file}@${r.w}: TOC contrast ${contrast(a,b).toFixed(2)} ${t.text}`)}
            }
            const cr=x=>{const a=rgb(x.color),b=rgb(x.bg);return a&&b?contrast(a,b):0};
            const ur=cr(admin.upload),dr=cr(admin.disabled);
            if(home.count!==5)issues.push(`home: expected 5 cards, got ${home.count}`);
            if(home.overlap)issues.push('home: dynamic continue title overlaps metadata');
            if(ur<4.5)issues.push(`admin: upload contrast ${ur.toFixed(2)}`);
            if(dr<4.5)issues.push(`admin: disabled contrast ${dr.toFixed(2)}`);
            console.log(`FINAL AUDIT: ${reports.length} views / ${files.length} HTML; low=${low}; faint=${faint}`);
            console.log(`REGRESSION FIXTURES: homeCards=${home.count} homeOverlap=${home.overlap} uploadContrast=${ur.toFixed(2)} disabledContrast=${dr.toFixed(2)}`);
            if(issues.length){console.error('ISSUES '+issues.length);issues.slice(0,100).forEach(x=>console.error(x));process.exit(1)}
            console.log('FINAL READABILITY PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node final-audit.js
