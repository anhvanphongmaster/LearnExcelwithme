name: Knowledge V2 PR gate

on:
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Product syntax and scope
        run: |
          node --check knowledge-data-foundation.js
          node --check knowledge-data-skills.js
          node --check knowledge-data-analysis.js
          node --check knowledge-data-advanced.js
          node --check knowledge-v2.js
          node --check skill-map.js
          node --check global-search.js
          node --check sw.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ctx={window:{},console};vm.createContext(ctx);
          ['knowledge-data-foundation.js','knowledge-data-skills.js','knowledge-data-analysis.js','knowledge-data-advanced.js'].forEach(f=>vm.runInContext(fs.readFileSync(f,'utf8'),ctx));
          const lessons=ctx.window.AVPKnowledgeLessons||[];
          if(lessons.length!==24)throw new Error(`Expected 24 lessons, got ${lessons.length}`);
          for(const z of ['foundation','skills','analysis','advanced'])if(lessons.filter(x=>x.zone===z).length!==6)throw new Error(`${z} != 6`);
          const bad=[];for(const l of lessons)for(const s of l.sections||[])for(const q of s.questions||[])if(!q.explain||q.explain.length<20)bad.push(l.id);
          if(bad.length)throw new Error(`Thin explanations: ${bad.join(',')}`);
          const search=fs.readFileSync('global-search.js','utf8');
          if([...search.matchAll(/K\('([^']+)'/g)].length!==24)throw new Error('Knowledge search count != 24');
          for(const title of ['Excel Playground','Thành tích & Nhiệm vụ','Practice Lab','Master Excel (áp dụng cho cả mobile)','Tài liệu thực hành'])if(!search.includes(`title:'${title}'`))throw new Error(`Search lost ${title}`);
          const mapJs=fs.readFileSync('skill-map.js','utf8');if(/XPKEY|QKEY|PKEY|unlocked\(|300 XP/.test(mapJs))throw new Error('Skill Map contains legacy lock logic');
          console.log('PASS Knowledge V2 PR gate');
          NODE
