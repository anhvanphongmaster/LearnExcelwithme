name: Back consistency staging

on:
  push:
    branches:
      - ui/sitewide-back-consistency-v4

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: |
          node --check avp-ui-system.js
          node --check avp-semantic-hierarchy-v3.js
          node --check sw.js

      - name: Shared component contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const css=fs.readFileSync('avp-semantic-hierarchy-v3.css','utf8');
          const js=fs.readFileSync('avp-semantic-hierarchy-v3.js','utf8');
          const ui=fs.readFileSync('avp-ui-system.js','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const must=[
            [css,'.avp-nav-back-step'],[css,'.avp-nav-back-root'],
            [css,'min-height:36px!important'],[css,'padding:8px 12px!important'],[css,'border-radius:10px!important'],
            [js,'avp-semantic-hierarchy-v3.css?v=20260909-sem4'],
            [ui,'avp-semantic-hierarchy-v3.js?v=20260909-sem4'],
            [sw,'learnexcel-assets-v20260909-semantic4']
          ];
          const missing=must.filter(([text,needle])=>!text.includes(needle)).map(([,needle])=>needle);
          if(missing.length) throw new Error('Missing shared back contract: '+missing.join(', '));
          console.log('Shared back component contract PASS');
          NODE

      - name: Sitewide back-hook audit
        run: |
          node <<'NODE'
          const fs=require('fs');
          const pages=fs.readdirSync('.').filter(f=>f.endsWith('.html'));
          const backSignal=/(?:class=["'][^"']*back|←|quay\s+lại|trở\s+lại|về\s+(?:trang|màn|khu|hub|lộ\s+trình))/i;
          const relevant=[];
          const missing=[];
          for(const file of pages){
            const html=fs.readFileSync(file,'utf8');
            if(!backSignal.test(html)) continue;
            relevant.push(file);
            if(!/avp-ui-system\.js/i.test(html)) missing.push(file);
          }
          console.log(`Back-navigation pages: ${relevant.length}/${pages.length}`);
          console.log(relevant.join('\n'));
          if(missing.length){
            console.error('Back pages missing shared AVP UI hook:');
            missing.forEach(f=>console.error(' - '+f));
            process.exit(2);
          }
          console.log('Sitewide back-hook audit PASS');
          NODE
