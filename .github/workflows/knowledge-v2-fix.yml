name: Knowledge V2 one-shot fix

on:
  push:
    branches:
      - knowledge/v2-full-curriculum

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix Knowledge V2 explanation contract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: knowledge/v2-full-curriculum
      - name: Patch the single thin explanation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('knowledge-data-analysis.js')
          s=p.read_text()
          old="explain:'200/1000=20%.'"
          new="explain:'Contribution = 200/1000 = 20%, tức Store A đóng góp một phần năm tổng Revenue.'"
          if old not in s:
              raise SystemExit('Expected thin explanation not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge-data-analysis.js
          git commit -m "Fix Knowledge V2 explanation contract"
          git push origin HEAD:knowledge/v2-full-curriculum
