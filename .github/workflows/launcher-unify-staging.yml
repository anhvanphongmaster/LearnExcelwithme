name: AVP launcher unification staging
on:
  push:
    branches: [fix/unify-avp-robot-launcher]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check avp-launcher-unify-v1.js
          node --check avp-ui-system.js
          node --check sw.js
      - name: Single-launcher contract
        run: |
          python - <<'PY'
          import pathlib
          guard=pathlib.Path('avp-launcher-unify-v1.js').read_text(encoding='utf-8')
          ui=pathlib.Path('avp-ui-system.js').read_text(encoding='utf-8')
          core=pathlib.Path('avp-core.js').read_text(encoding='utf-8')
          ai=pathlib.Path('ai-chat.js').read_text(encoding='utf-8')
          chat=pathlib.Path('admin-chat.js').read_text(encoding='utf-8')
          for token in ['avpEdgeMain','avpChatBubble','avpAiChatBubble','display',"'none'",'important','MutationObserver']:
              assert token in guard, token
          assert 'robotReady()' in guard
          assert "script.src='avp-launcher-unify-v1.js?v=20260910-launcher1'" in ui
          assert 'ensureLauncherUnifier()' in ui
          assert "className='avp-edge-launcher is-right is-robot is-walking'" in core
          assert 'id="avpAiChatBubble"' in ai
          assert 'id="avpChatBubble"' in chat
          # Panels remain in legacy modules; only their standalone launch buttons are suppressed.
          assert 'avpAiChatPanel' in ai
          assert 'avpChatPanel' in chat
          print('Single-launcher contract PASS')
          PY
      - name: Cache contract
        run: |
          python - <<'PY'
          import pathlib
          sw=pathlib.Path('sw.js').read_text(encoding='utf-8')
          assert 'v20260910-launcherunify1' in sw
          assert './avp-launcher-unify-v1.js' in sw
          print('Cache contract PASS')
          PY
