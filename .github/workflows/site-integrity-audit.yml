name: Site integrity audit

on:
  push:
    branches:
      - audit/sitewide-integrity-v1

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit local navigation and page integrity
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const root=process.cwd();
          const skipDirs=new Set(['.git','.github','node_modules']);
          function walk(dir){
            let out=[];
            for(const e of fs.readdirSync(dir,{withFileTypes:true})){
              if(e.isDirectory()&&skipDirs.has(e.name))continue;
              const p=path.join(dir,e.name);
              if(e.isDirectory())out=out.concat(walk(p)); else out.push(p);
            }
            return out;
          }
          const files=walk(root);
          const relFiles=new Set(files.map(f=>path.relative(root,f).replace(/\\/g,'/')));
          const htmlFiles=files.filter(f=>f.endsWith('.html'));
          const jsFiles=files.filter(f=>f.endsWith('.js'));
          const problems=[];
          const warnings=[];
          const rootRelative=[];
          const placeholders=[];
          const duplicateIds=[];
          const missingAnchors=[];
          const missingLocal=[];
          const dynamicHtmlMissing=[];
          const basePrefix='/LearnExcelwithme/';
          function cleanUrl(raw){return String(raw||'').trim().replace(/&amp;/g,'&')}
          function isExternal(u){return /^(?:[a-z]+:)?\/\//i.test(u)||/^(?:mailto:|tel:|data:|blob:|javascript:)/i.test(u)}
          function localTarget(from,raw){
            let u=cleanUrl(raw);
            if(!u||u==='#')return null;
            if(isExternal(u))return null;
            if(u.startsWith('#'))return {anchor:u.slice(1),file:path.relative(root,from).replace(/\\/g,'/')};
            u=u.split('#')[0].split('?')[0];
            try{u=decodeURIComponent(u)}catch{}
            if(!u)return null;
            if(u.startsWith(basePrefix))u=u.slice(basePrefix.length);
            else if(u.startsWith('/')){rootRelative.push({file:path.relative(root,from).replace(/\\/g,'/'),url:raw});u=u.slice(1)}
            const base=path.dirname(path.relative(root,from));
            let target=path.normalize(path.join(base,u)).replace(/\\/g,'/');
            if(u.endsWith('/'))target=path.join(target,'index.html').replace(/\\/g,'/');
            if(target==='.')target='index.html';
            return {file:target};
          }
          for(const file of htmlFiles){
            const rel=path.relative(root,file).replace(/\\/g,'/');
            const text=fs.readFileSync(file,'utf8');
            const ids=[...text.matchAll(/\bid\s*=\s*["']([^"']+)["']/gi)].map(m=>m[1]);
            const seen=new Set();
            for(const id of ids){if(seen.has(id))duplicateIds.push({file:rel,id});seen.add(id)}
            for(const m of text.matchAll(/\b(?:href|src|action|poster)\s*=\s*["']([^"']*)["']/gi)){
              const raw=m[1];
              if(raw===''||raw==='#'||/^javascript:\s*void\s*\(0\)/i.test(raw)){placeholders.push({file:rel,url:raw});continue}
              const t=localTarget(file,raw);if(!t)continue;
              if(t.anchor){if(t.anchor&&!ids.includes(t.anchor))missingAnchors.push({file:rel,anchor:t.anchor});continue}
              if(t.file&&!relFiles.has(t.file)){
                // extensionless path may represent an html page
                if(!path.extname(t.file)&&relFiles.has(t.file+'.html'))continue;
                missingLocal.push({file:rel,url:raw,target:t.file});
              }
            }
          }
          // Catch hard-coded local HTML destinations in JS, excluding template fragments and URLs.
          for(const file of jsFiles){
            const rel=path.relative(root,file).replace(/\\/g,'/');
            const text=fs.readFileSync(file,'utf8');
            for(const m of text.matchAll(/["'`]([^"'`\n]*?\.html(?:\?[^"'`\n]*)?(?:#[^"'`\n]*)?)["'`]/g)){
              const raw=m[1];
              if(raw.includes('${')||isExternal(raw))continue;
              const t=localTarget(file,raw);if(t?.file&&!relFiles.has(t.file))dynamicHtmlMissing.push({file:rel,url:raw,target:t.file});
            }
          }
          function print(name,arr,limit=120){
            console.log(`\n=== ${name}: ${arr.length} ===`);
            arr.slice(0,limit).forEach(x=>console.log(JSON.stringify(x)));
            if(arr.length>limit)console.log(`... +${arr.length-limit} more`);
          }
          console.log(`HTML pages: ${htmlFiles.length}; total files: ${files.length}`);
          print('MISSING_LOCAL_REFERENCES',missingLocal);
          print('MISSING_JS_HTML_DESTINATIONS',dynamicHtmlMissing);
          print('DUPLICATE_IDS',duplicateIds);
          print('MISSING_SAME_PAGE_ANCHORS',missingAnchors);
          print('ROOT_RELATIVE_URLS_RISKY_ON_PROJECT_PAGES',rootRelative);
          print('PLACEHOLDER_LINKS',placeholders);
          const hard=missingLocal.length+dynamicHtmlMissing.length+duplicateIds.length+missingAnchors.length;
          console.log(`\nAUDIT_SUMMARY hard=${hard} rootRelative=${rootRelative.length} placeholders=${placeholders.length}`);
          if(hard)process.exitCode=2;
          NODE
