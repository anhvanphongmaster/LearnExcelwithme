name: UI Asset Version Bump

on:
  workflow_dispatch:
  push:
    branches: [ui-readability-hardening-v2]

permissions:
  contents: write

jobs:
  bump:
    if: ${{ !contains(github.event.head_commit.message, '[ui2-bump]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-readability-hardening-v2
      - name: Bump shared UI assets across root HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changed=[]
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              n=s.replace('avp-ui-system.css?v=20260909-ui1','avp-ui-system.css?v=20260909-ui2')
              n=n.replace('avp-ui-system.js?v=20260909-ui1','avp-ui-system.js?v=20260909-ui2')
              if n!=s:
                  p.write_text(n,encoding='utf-8')
                  changed.append(p.name)
          print(f'Updated {len(changed)} HTML files')
          if len(changed)!=57:
              raise SystemExit(f'Expected 57 root HTML files to update, got {len(changed)}')
          PY
          git config user.name 'anhvanphong'
          git config user.email 'anhvanphongmaster@gmail.com'
          git add -- '*.html'
          git diff --cached --quiet && exit 0
          git commit -m 'UI: bump shared readability assets sitewide [ui2-bump]'
          git push origin HEAD:ui-readability-hardening-v2
