name: Pro content production patch

on:
  push:
    branches:
      - pro/content-production-dashboard

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Pro content production dashboard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path=Path('admin-professional-track.js')
          js=js_path.read_text(encoding='utf-8')
          marker='// Pro content coverage V1'
          if marker not in js:
              anchor='  function renderCatalog(){\n'
              assert anchor in js, 'renderCatalog anchor missing'
              block=r'''  // Pro content coverage V1 — purely client-side, no extra Supabase queries.
  function graderMetadataReady(row){
    const validation=row?.grader_validation&&typeof row.grader_validation==="object"?row.grader_validation:null;
    const tests=validation?.tests||{};
    return validation?.status==="validated"
      &&validation?.version==="AVP_PRO_GRADER_V3"
      &&Number(tests.pass)===10
      &&Number(tests.hardcode)<7
      &&Number(tests.wrong_formula)<7;
  }

  function caseDraftReady(row){
    return Boolean(privatePath(row?.source_url))
      &&Boolean(privatePath(row?.guide_url))
      &&(row?.submission_enabled===false||graderMetadataReady(row));
  }

  function allCaseSlots(){
    const slots=[];
    Object.entries(DOMAIN_MODULES).forEach(([domainKey,domain])=>{
      domain.modules.forEach((moduleTitle,moduleOffset)=>{
        LEVELS.forEach(level=>{
          [1,2,3].forEach(caseIndex=>slots.push({
            key:`${domainKey}-${moduleOffset+1}-${level.id}-${caseIndex}`,
            domainKey,
            domainTitle:domain.title,
            moduleIndex:moduleOffset+1,
            moduleTitle,
            levelId:level.id,
            levelTitle:level.title,
            caseIndex
          }));
        });
      });
    });
    return slots;
  }

  function prepareEmptySlot(domainKey,moduleIndex,levelId,caseIndex){
    resetCaseForm();
    if(!DOMAIN_MODULES[domainKey])return;
    $("aptCaseDomain").value=domainKey;
    fillModuleOptions(String(moduleIndex));
    $("aptCaseModule").value=String(moduleIndex);
    $("aptCaseLevel").value=levelId;
    $("aptCaseIndex").value=String(caseIndex);
    $("aptCasePublished").checked=false;
    const key=selectedCaseKey();
    clearReferenceState(`Ô ${key} đang trống. Hãy nhập brief thật và upload Student / Guide / Reference; hệ thống không tự sinh nội dung.`);
    $("aptCaseForm").scrollIntoView({behavior:"smooth",block:"start"});
    $("aptCaseTitle").focus();
  }

  function ensureCoveragePanel(){
    let panel=$("aptCoverage");
    if(panel)return panel;
    const filters=$("aptCatalogSearch")?.closest(".apt-catalog-filters");
    if(!filters)return null;
    filters.insertAdjacentHTML("beforebegin",`<section class="apt-coverage" id="aptCoverage">
      <div class="apt-coverage-head"><div><span>CONTENT COVERAGE</span><h3>Tiến độ xây thư viện Case Pro</h3></div><small>480 ô chuẩn = 8 lĩnh vực × 5 nội dung × 4 Level × 3 Case. Chỉ theo dõi trạng thái; không tạo Case hoặc file giả.</small></div>
      <div class="apt-coverage-kpis" id="aptCoverageKpis"></div>
      <div class="apt-coverage-domains" id="aptCoverageDomains"></div>
      <div class="apt-coverage-next"><div><span>Ô trống tiếp theo</span><small>Dùng bộ lọc lĩnh vực / Level bên dưới để thu hẹp danh sách.</small></div><div class="apt-empty-slots" id="aptCoverageNext"></div></div>
    </section>`);
    panel=$("aptCoverage");
    panel?.addEventListener("click",event=>{
      const button=event.target.closest("[data-pro-empty-slot]");
      if(!button)return;
      prepareEmptySlot(button.dataset.slotDomain,Number(button.dataset.slotModule),button.dataset.slotLevel,Number(button.dataset.slotCase));
    });
    return panel;
  }

  function renderCoverage(){
    const panel=ensureCoveragePanel();if(!panel)return;
    const slots=allCaseSlots(),rowMap=new Map(catalogData.map(row=>[String(row.case_key),row]));
    const configured=catalogData.length;
    const published=catalogData.filter(row=>row.published===true).length;
    const readyDraft=catalogData.filter(row=>row.published!==true&&caseDraftReady(row)).length;
    const incomplete=catalogData.filter(row=>row.published!==true&&!caseDraftReady(row)).length;
    const empty=Math.max(0,slots.length-configured);
    $("aptCoverageKpis").innerHTML=`<article><span>Tổng ô chuẩn</span><strong>${slots.length}</strong><small>Cấu trúc cố định</small></article><article><span>Đã tạo</span><strong>${configured}</strong><small>${empty} ô còn trống</small></article><article><span>Draft đủ cấu hình</span><strong>${readyDraft}</strong><small>Student + Guide + Grader metadata</small></article><article><span>Đã phát hành</span><strong>${published}</strong><small>${incomplete} Draft còn thiếu cấu hình</small></article>`;

    $("aptCoverageDomains").innerHTML=Object.entries(DOMAIN_MODULES).map(([domainKey,domain])=>{
      const rows=catalogData.filter(row=>row.domain_key===domainKey);
      const live=rows.filter(row=>row.published===true).length;
      const ready=rows.filter(row=>row.published!==true&&caseDraftReady(row)).length;
      return `<article><span>${esc(domain.title)}</span><strong>${rows.length}/60</strong><small>${live} published · ${ready} draft đủ cấu hình</small></article>`;
    }).join("");

    const domainFilter=$("aptCatalogDomainFilter")?.value||"";
    const levelFilter=$("aptCatalogLevelFilter")?.value||"";
    const missing=slots.filter(slot=>!rowMap.has(slot.key)&&(!domainFilter||slot.domainKey===domainFilter)&&(!levelFilter||slot.levelId===levelFilter)).slice(0,6);
    $("aptCoverageNext").innerHTML=missing.length?missing.map(slot=>`<button type="button" data-pro-empty-slot data-slot-domain="${esc(slot.domainKey)}" data-slot-module="${slot.moduleIndex}" data-slot-level="${esc(slot.levelId)}" data-slot-case="${slot.caseIndex}"><span>${esc(slot.domainTitle)} · Nội dung ${slot.moduleIndex}</span><strong>${esc(slot.levelTitle)} · Case ${String(slot.caseIndex).padStart(2,"0")}</strong><small>${esc(slot.moduleTitle)}</small></button>`).join(""):'<p>Không còn ô trống trong phạm vi bộ lọc hiện tại.</p>';
  }

'''
              js=js.replace(anchor,block+anchor,1)
              start='  function renderCatalog(){\n    const box='
              assert start in js, 'renderCatalog start missing'
              js=js.replace(start,'  function renderCatalog(){\n    renderCoverage();\n    const box=',1)
              js_path.write_text(js,encoding='utf-8')

          css_path=Path('admin-professional-track.css')
          css=css_path.read_text(encoding='utf-8')
          css_marker='/* Pro content coverage V1 */'
          if css_marker not in css:
              css += r'''

/* Pro content coverage V1 */
.apt-coverage{margin:0 0 13px;padding:14px;border:1px solid #d8e7de;border-radius:15px;background:#fbfdfc}
.apt-coverage-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:10px}.apt-coverage-head span,.apt-coverage-next>div>span{color:#217346;font-size:8px;font-weight:950;letter-spacing:1px}.apt-coverage-head h3{margin:4px 0 0;color:#173f2d;font-size:15px}.apt-coverage-head small{max-width:470px;color:#74857b;font-size:9px;line-height:1.5;text-align:right}
.apt-coverage-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.apt-coverage-kpis article{padding:10px;border:1px solid #e0e9e3;border-radius:10px;background:#fff}.apt-coverage-kpis span{display:block;color:#667a6e;font-size:8px;font-weight:850}.apt-coverage-kpis strong{display:block;margin:3px 0;color:#174f31;font-size:18px}.apt-coverage-kpis small{color:#829087;font-size:8px;line-height:1.35}
.apt-coverage-domains{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:8px}.apt-coverage-domains article{padding:9px;border-radius:9px;background:#f3f8f5}.apt-coverage-domains span{display:block;overflow:hidden;color:#4f685a;font-size:8px;font-weight:850;text-overflow:ellipsis;white-space:nowrap}.apt-coverage-domains strong{display:block;margin:4px 0 2px;color:#1e5b38;font-size:12px}.apt-coverage-domains small{color:#7d8c83;font-size:7.5px}
.apt-coverage-next{margin-top:10px;padding-top:10px;border-top:1px solid #e1ebe5}.apt-coverage-next>div:first-child{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:7px}.apt-coverage-next>div:first-child small{color:#7a8a81;font-size:8px}.apt-empty-slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.apt-empty-slots button{display:grid;gap:3px;min-width:0;padding:9px 10px;text-align:left;border:1px dashed #bdd4c6;border-radius:9px;background:#fff;color:#264f38;cursor:pointer}.apt-empty-slots button:hover{border-style:solid;border-color:#79ab8c;background:#f5faf7}.apt-empty-slots span,.apt-empty-slots small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.apt-empty-slots span{color:#6d8074;font-size:7.5px}.apt-empty-slots strong{font-size:9px}.apt-empty-slots small{color:#829087;font-size:7px}.apt-empty-slots>p{grid-column:1/-1;margin:0;padding:10px;border-radius:9px;background:#f4f7f5;color:#718078;font-size:8px}
@media(max-width:900px){.apt-coverage-kpis,.apt-coverage-domains{grid-template-columns:repeat(2,minmax(0,1fr))}.apt-empty-slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.apt-coverage-head,.apt-coverage-next>div:first-child{display:grid}.apt-coverage-head small{text-align:left}.apt-coverage-kpis,.apt-coverage-domains,.apt-empty-slots{grid-template-columns:1fr}}
'''
              css_path.write_text(css,encoding='utf-8')

          html_path=Path('admin.html')
          html=html_path.read_text(encoding='utf-8')
          html=html.replace('admin-professional-track.css?v=20260909-pro-system1','admin-professional-track.css?v=20260909-pro-content1')
          html=html.replace('admin-professional-track.js?v=20260909-pro-system3-ui1','admin-professional-track.js?v=20260909-pro-content1')
          html_path.write_text(html,encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-professional-track.js admin-professional-track.css admin.html
          if git diff --cached --quiet; then
            echo "No patch needed."
            exit 0
          fi
          git commit -m "Pro: add content production coverage dashboard"
          git push origin HEAD:${GITHUB_REF_NAME}
