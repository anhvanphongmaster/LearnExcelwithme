name: Pro content production patch

on:
  push:
    branches:
      - pro/content-production-dashboard

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python tmp-pro-content-patch.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-professional-track.js admin-professional-track.css admin.html
          if git diff --cached --quiet; then
            echo "No patch needed."
            exit 0
          fi
          git commit -m "Pro: add content production coverage dashboard"
          git push origin HEAD:${GITHUB_REF_NAME}
