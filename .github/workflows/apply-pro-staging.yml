name: Apply Pro staging patch
on:
  push:
    branches: [pro-system-v1-staging]
    paths: [.pro-system-v1.patch]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pro-system-v1-staging
          fetch-depth: 0
      - name: Apply controlled Professional Track patch
        run: |
          git apply --check .pro-system-v1.patch
          git apply .pro-system-v1.patch
          node --check professional-access.js
          node --check admin-professional-track.js
          node --check professional-track-ux.js
      - name: Commit staged implementation
        run: |
          git config user.name "anhvanphongmaster"
          git config user.email "anhvanphongmaster@gmail.com"
          git add professional-access.js professional-track.html admin-professional-track.js professional-track-ux.js supabase/functions/professional-grader/index.ts
          git commit -m "Pro: implement access, grader validation and learner flow"
          git push origin pro-system-v1-staging
