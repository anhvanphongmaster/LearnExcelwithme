name: Knowledge V2 search regression fix

on:
  push:
    branches:
      - knowledge/v2-full-curriculum

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Restore non-Knowledge search entries'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: knowledge/v2-full-curriculum
      - name: Restore unrelated global search entries
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('global-search.js')
          s=p.read_text()
          anchor="    {icon:'👤',title:'Dashboard cá nhân',desc:'Hoạt động và kết quả học tập cá nhân',url:'dashboard.html',type:'Cá nhân',keys:'dashboard ca nhan level xp streak tien do'},\n"
          block="""    {icon:'🧪',title:'Excel Playground',desc:'10 bài thực hành công thức có chấm điểm và XP',url:'playground.html',type:'Thực hành',keys:'playground thuc hanh bai tap formula xp'},
    {icon:'🏆',title:'Thành tích & Nhiệm vụ',desc:'Huy hiệu, nhiệm vụ hằng ngày, XP và streak',url:'achievements.html',type:'Cá nhân',keys:'thanh tich achievement huy hieu nhiem vu hang ngay daily quest xp streak'},
    {icon:'🧪',title:'Practice Lab',desc:'3 project Excel thực chiến Pivot, Dashboard và DAX',url:'practice-lab.html',type:'Thực hành',keys:'practice lab project pivot dashboard dax thuc chien'},
    {icon:'📱',title:'Master Excel (áp dụng cho cả mobile)',desc:'Upload và xử lý file Excel trên điện thoại hoặc máy tính',url:'excel-mobile.html',type:'Công cụ',keys:'master excel mobile dien thoai upload xu ly file excel'},
    {icon:'📥',title:'Tài liệu thực hành',desc:'File Excel mẫu và bài tập theo video',url:'practice-video.html',type:'Tài liệu',keys:'tai lieu download file mau excel pivot pareto qc video practice'},
"""
          if "title:'Excel Playground'" in s:
              raise SystemExit('Search entries already restored')
          if anchor not in s:
              raise SystemExit('Expected Dashboard search anchor not found')
          p.write_text(s.replace(anchor,anchor+block,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-search.js
          git commit -m "Restore non-Knowledge search entries"
          git push origin HEAD:knowledge/v2-full-curriculum
