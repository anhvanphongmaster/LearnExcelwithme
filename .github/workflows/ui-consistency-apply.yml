          change('script.js','function datLaiTienDo() {','async function datLaiTienDo() {')
          change('script.js','''    const confirmReset =\n        confirm("Bạn có chắc muốn đặt lại toàn bộ tiến độ học không?");''','''    const confirmReset =\n        await window.avpConfirm("Toàn bộ tiến độ học lưu trên thiết bị này sẽ được đặt lại.",{title:"Đặt lại tiến độ?",icon:"↺",tone:"warn",ok:"Đặt lại",cancel:"Hủy"});''')
