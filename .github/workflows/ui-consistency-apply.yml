          change('focus-room.js','if(confirm("Xóa toàn bộ lịch sử Focus Room trên thiết bị này?")){','if(await window.avpConfirm("Toàn bộ lịch sử Focus Room trên thiết bị này sẽ bị xóa.",{title:"Xóa lịch sử Focus Room?",icon:"🗑️",tone:"danger",ok:"Xóa lịch sử",cancel:"Hủy"})){')
          # make the containing click handler async for Focus Room
          p=Path('focus-room.js');s=p.read_text(encoding='utf-8');s=s.replace("clearHistory?.addEventListener('click', () => {","clearHistory?.addEventListener('click', async () => {",1);p.write_text(s,encoding='utf-8')
