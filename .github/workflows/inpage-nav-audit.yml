name: In-page Nav Audit

on:
  push:
    branches: [fix-inpage-nav-readability]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Static nav inventory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          seen=[]
          for p in sorted(Path('.').glob('*.html')):
              for t in re.findall(r'<nav\b[^>]*>',p.read_text(encoding='utf-8',errors='ignore'),re.I):
                  seen.append((p.name,re.sub(r'\s+',' ',t)[:220]))
          print('NAV TAGS',len(seen))
          for row in seen: print(*row)
          PY
      - name: Browser regression audit
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          cat > nav-audit.js <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          const rgb=s=>{const m=String(s||'').match(/rgba?\((\d+)[, ]+(\d+)[, ]+(\d+)/);return m?[+m[1],+m[2],+m[3]]:null};
          const lum=c=>c.map(v=>v/255).map(v=>v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0);
          const contrast=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
          (async()=>{
            const files=fs.readdirSync('.').filter(f=>f.endsWith('.html')).sort();
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({serviceWorkers:'block',reducedMotion:'reduce'});
            await ctx.route('**/*',r=>r.request().url().startsWith('http://127.0.0.1:4173/')?r.continue():r.abort());
            const page=await ctx.newPage();
            const bad=[]; let navCount=0;
            for(const file of files){
              await page.setViewportSize({width:1366,height:900});
              try{await page.goto('http://127.0.0.1:4173/'+file,{waitUntil:'domcontentloaded',timeout:7000});await page.waitForTimeout(180)}catch(e){}
              const rows=await page.evaluate(()=>[...document.querySelectorAll('nav')].map(n=>{const s=getComputedStyle(n);return {cls:String(n.className||''),id:n.id||'',pos:s.position,bg:s.backgroundColor,shadow:s.boxShadow}}));
              navCount+=rows.length;
              for(const n of rows){
                if(n.cls.split(/\s+/).includes('top-simple-nav')) continue;
                if(n.pos==='sticky'||n.pos==='fixed'||n.bg==='rgb(24, 92, 55)') bad.push(`${file}: ${n.cls||'#'+n.id} pos=${n.pos} bg=${n.bg}`);
              }
            }

            await page.goto('http://127.0.0.1:4173/professional-track.html',{waitUntil:'domcontentloaded'});
            await page.evaluate(()=>{const g=document.getElementById('ptGate'),p=document.getElementById('ptProtectedContent'),b=document.getElementById('proBreadcrumb');if(g)g.hidden=true;if(p)p.hidden=false;if(b){b.hidden=false;b.innerHTML='<span>Professional</span><i>/</i><span>NHẬP LIỆU & DATA QUALITY</span><i>/</i><span class="current">LEVEL 01</span>'}});
            await page.waitForTimeout(700);
            const pro=await page.evaluate(()=>{
              const cards=[...document.querySelectorAll('[data-roll="domains"] [data-roll-card]')];
              const b=document.getElementById('proBreadcrumb'),bs=b?getComputedStyle(b):null,p=document.querySelector('[data-roll="domains"] .pro-card p'),ps=p?getComputedStyle(p):null;
              return {opacities:cards.map(c=>Number(getComputedStyle(c).opacity)),breadcrumb:bs?{pos:bs.position,bg:bs.backgroundColor,color:bs.color,shadow:bs.boxShadow}:null,cardPColor:ps?.color||''};
            });
            const minOpacity=pro.opacities.length?Math.min(...pro.opacities):0;
            if(minOpacity<.88) bad.push(`professional-track: roll min opacity ${minOpacity.toFixed(2)} < 0.88`);
            if(pro.breadcrumb&&(pro.breadcrumb.pos==='sticky'||pro.breadcrumb.bg==='rgb(24, 92, 55)')) bad.push(`professional-track: breadcrumb still inherits global nav ${JSON.stringify(pro.breadcrumb)}`);
            const pc=rgb(pro.cardPColor); if(!pc||contrast(pc,[255,255,255])<5) bad.push(`professional-track: card body text contrast too low ${pro.cardPColor}`);

            await browser.close();
            console.log(`NAV AUDIT: ${navCount} nav nodes across ${files.length} HTML; proRollMinOpacity=${minOpacity.toFixed(2)} cardP=${pro.cardPColor}`);
            if(bad.length){console.error('FAIL '+bad.length);bad.forEach(x=>console.error(x));process.exit(1)}
            console.log('IN-PAGE NAV + PRO READABILITY PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node nav-audit.js
