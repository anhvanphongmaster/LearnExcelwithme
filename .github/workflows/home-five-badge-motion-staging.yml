name: Home Five Badge Motion Staging
on:
  push:
    branches: [fix/home-five-badge-motion]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check avp-home-knowledge-v2.js
          node --check sw.js
      - name: Five badge classes
        run: |
          grep -q 'avp-mini-channel-hw' avp-home-knowledge-v2.js
          grep -q 'avp-mini-channel-pro' avp-home-knowledge-v2.js
          grep -q 'avp-mini-channel-tt' avp-home-knowledge-v2.js
          grep -q 'avp-mini-channel-yt' avp-home-knowledge-v2.js
          grep -q 'avp-mini-channel-grade' avp-home-knowledge-v2.js
      - name: Ordered 3D motion
        run: |
          grep -q 'avpMiniBounceFive' avp-home-knowledge-v2.css
          grep -q 'avpMiniFlashFive' avp-home-knowledge-v2.css
          grep -q 'translate3d(0,-8px,16px)' avp-home-knowledge-v2.css
          grep -q 'animation-delay:.44s' avp-home-knowledge-v2.css
          grep -q 'animation-delay:.66s' avp-home-knowledge-v2.css
          grep -q 'animation-delay:.88s' avp-home-knowledge-v2.css
      - name: Cache
        run: grep -q 'badgemotion5' sw.js
