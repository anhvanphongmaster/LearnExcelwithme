name: Pro content coverage test

on:
  push:
    branches:
      - pro/content-production-dashboard

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: node --check admin-professional-track.js
      - name: Coverage contract
        shell: bash
        run: |
          grep -q "Pro content coverage V1" admin-professional-track.js
          grep -q "480 ô chuẩn" admin-professional-track.js
          grep -q "data-pro-empty-slot" admin-professional-track.js
          grep -q "admin-professional-track.js?v=20260909-pro-content1" admin.html
          grep -q "admin-professional-track.css?v=20260909-pro-content1" admin.html
          grep -q "Pro content coverage V1" admin-professional-track.css
