<script>
(()=>{"use strict";if(new URLSearchParams(location.search).has("embed"))document.body.classList.add("embed");const view=document.getElementById("viewport"),world=document.getElementById("world"),label=document.getElementById("currentLabel");let x=0,y=0,scale=.7,drag=false,sx=0,sy=0,ox=0,oy=0,pointers=new Map(),pinchStart=0,pinchScale=scale;const key="avp_learning_map_last_location_v1",visitedKey="avp_learning_map_visited_v1";let visited=[];try{visited=JSON.parse(localStorage.getItem(visitedKey)||"[]")}catch(_){}const file=(location.pathname.split("/").pop()||"index.html").toLowerCase();const nodes=[...document.querySelectorAll(".node")];let current=nodes.find(n=>n.dataset.url.toLowerCase()===file);if(!current){let id="home";try{id=localStorage.getItem(key)||"home"}catch(_){}current=nodes.find(n=>n.dataset.id===id)||nodes[0]}function apply(){world.style.transform="translate("+x+"px,"+y+"px) scale("+scale+")"}function mark(n){nodes.forEach(v=>{v.classList.toggle("current",v===n);v.classList.toggle("done",visited.includes(v.dataset.id)&&v!==n)});label.textContent=n.querySelector("b").textContent+" · "+n.querySelector("small").textContent;const id=n.dataset.id;if(!visited.includes(id))visited.push(id);try{localStorage.setItem(visitedKey,JSON.stringify(visited));localStorage.setItem(key,id)}catch(_){}}function centerOn(n){const r=view.getBoundingClientRect(),cx=parseFloat(n.style.left)+n.offsetWidth/2,cy=parseFloat(n.style.top)+n.offsetHeight/2;x=r.width/2-cx*scale;y=r.height/2-cy*scale;apply()}function fit(){const r=view.getBoundingClientRect();scale=Math.max(.34,Math.min(.78,Math.min(r.width/1600,r.height/1120)*.94));centerOn(current)}mark(current);nodes.forEach(n=>n.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();mark(n);try{sessionStorage.setItem("avp_map_mini_enabled_v1","1")}catch(_){}const url=new URL(n.dataset.url,location.href).href;if(window.parent!==window){parent.postMessage({type:"AVP_MAP_NAVIGATE",url,id:n.dataset.id},location.origin)}else location.href=url}));view.addEventListener("pointerdown",e=>{if(e.target.closest(".node,.tools button,.top button"))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});view.setPointerCapture(e.pointerId);if(pointers.size===1){drag=true;view.classList.add("dragging");sx=e.clientX;sy=e.clientY;ox=x;oy=y}else if(pointers.size===2){drag=false;const a=[...pointers.values()];pinchStart=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);pinchScale=scale}});view.addEventListener("pointermove",e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&drag){x=ox+e.clientX-sx;y=oy+e.clientY-sy;apply()}else if(pointers.size===2){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);scale=Math.max(.32,Math.min(1.25,pinchScale*d/(pinchStart||d)));apply()}});function end(e){pointers.delete(e.pointerId);if(!pointers.size){drag=false;view.classList.remove("dragging")}else if(pointers.size===1){const p=[...pointers.values()][0];sx=p.x;sy=p.y;ox=x;oy=y;drag=true}}view.addEventListener("pointerup",end);view.addEventListener("pointercancel",end);view.addEventListener("wheel",e=>{e.preventDefault();zoom(e.deltaY<0?1.1:.9,e.clientX,e.clientY)},{passive:false});function zoom(f,px,py){const r=view.getBoundingClientRect(),cx=px==null?r.width/2:px-r.left,cy=py==null?r.height/2:py-r.top,old=scale;scale=Math.max(.32,Math.min(1.25,scale*f));x=cx-(cx-x)*scale/old;y=cy-(cy-y)*scale/old;apply()}document.getElementById("plus").onclick=()=>zoom(1.18);document.getElementById("minus").onclick=()=>zoom(.84);document.getElementById("locate").onclick=()=>centerOn(current);document.getElementById("home").onclick=()=>location.href="index.html";fit();window.addEventListener("resize",fit)})();
