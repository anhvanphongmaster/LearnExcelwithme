<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#20372b;background:#e9f0e6}

.terrain{position:absolute;inset:0;width:1500px;height:1050px}.region{position:absolute;border:1px solid #a9bea5;background:#edf4e8dd;border-radius:48% 42% 45% 38%;box-shadow:inset 0 0 50px #b9d0b355}.region h2{margin:22px 26px;font-size:18px;color:#6c896f;letter-spacing:.08em;text-transform:uppercase}.node{position:absolute;z-index:2;width:180px;min-height:92px;padding:12px 14px;border-radius:17px;border:1px solid #c6d6c2;background:#fffdf7;box-shadow:0 10px 25px #31563a1c;cursor:pointer;text-align:left;color:#24422f;transition:transform .18s,box-shadow .18s}.node:hover{transform:translateY(-4px);box-shadow:0 16px 32px #31563a2c}.node .ico{font-size:23px;display:block;margin-bottom:5px}.node b{display:block;font-size:13px}.node small{display:block;color:#758578;font-size:10px;margin-top:4px;line-height:1.4}.node.done{border-color:#67ad7b;background:#f1fbf1}.node.current{border:2px solid #16814d;box-shadow:0 0 0 6px #45a96c22,0 14px 30px #31563a25}.node.current:after{content:"BẠN ĐANG Ở ĐÂY";position:absolute;top:-12px;left:12px;border-radius:20px;background:#147849;color:white;padding:4px 8px;font-size:9px;font-weight:900;letter-spacing:.06em}.node.locked{background:#f4f5ef;border-style:dashed}.path{fill:none;stroke:#9ab89a;stroke-width:9;stroke-linecap:round;stroke-dasharray:2 17}.pathDone{fill:none;stroke:#2f9a60;stroke-width:8;stroke-linecap:round;stroke-dasharray:2 17}.legend{position:absolute;left:16px;bottom:16px;z-index:4;display:flex;gap:12px;flex-wrap:wrap;padding:10px 13px;background:#ffffffed;border:1px solid #d5e1d2;border-radius:12px;font-size:11px;color:#506653;box-shadow:0 8px 25px #243d2817}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:#2f9a60}.dot.gray{background:#b5c0b1}.tools{position:absolute;right:16px;bottom:16px;z-index:4;display:flex;gap:7px}.tools button{width:42px;height:42px;font-size:18px;padding:0;box-shadow:0 5px 15px #243d2817}.hint{position:absolute;right:16px;top:16px;z-index:3;padding:8px 11px;background:#ffffffdf;border:1px solid #d5e1d2;border-radius:10px;color:#6b7e6c;font-size:11px}
@media(max-width:650px){.top{padding:10px;gap:8px}.brand{font-size:12px}.where strong{font-size:12px}.top button{font-size:11px;padding:8px}.hint{top:auto;bottom:70px;right:12px;font-size:10px}.legend{left:10px;bottom:10px;font-size:10px;max-width:calc(100% - 130px)}.tools{right:10px;bottom:10px;flex-direction:column}}
body.embed #app .top{display:none}body.embed #viewport{height:100dvh;min-height:100dvh}body.embed #app{height:100dvh}body.embed .hint{top:14px;right:76px}body.embed .legend{bottom:14px}body.embed .tools{bottom:14px}
</style></head><body><main id="app"><header class="top"><div class="brand">ANH VĂN <span>PHÒNG</span></div><div class="where"><small>VỊ TRÍ HÀNH TRÌNH CỦA BẠN</small><strong id="currentLabel">Điểm xuất phát · Trang chủ</strong></div><button id="home">⌂ Trang chủ</button></header><section id="viewport" aria-label="Bản đồ khám phá website"><div id="world">

<defs><linearGradient id="sea" x2="0" y2="1"><stop stop-color="#e5efdf"/><stop offset="1" stop-color="#d7e5d4"/></linearGradient></defs><rect width="1500" height="1050" fill="url(#sea)"/>
<path d="M80 330 C80 130 300 80 510 130 S850 65 1010 190 S1370 160 1420 360 S1360 710 1190 810 S860 1000 620 900 S240 1000 110 760 S20 500 80 330Z" fill="#d4e5ce" stroke="#abc5a7" stroke-width="4"/>
<path d="M180 440 C280 300 430 290 560 390 S780 470 870 330 S1110 250 1250 400 S1220 650 1050 680 S790 790 630 680 S330 750 210 620" class="path"/>
<path d="M180 440 C280 300 430 290 560 390 S780 470 870 330 S1110 250 1250 400 S1220 650 1050 680 S790 790 630 680 S330 750 210 620" class="pathDone" id="progressPath" stroke-dasharray="0 9999"/>
<g fill="#bdd2b7" opacity=".7"><circle cx="330" cy="230" r="8"/><circle cx="1170" cy="230" r="12"/><circle cx="1350" cy="610" r="9"/><circle cx="430" cy="820" r="11"/><circle cx="900" cy="870" r="7"/></g>

</div><div class="hint">Kéo để di chuyển · Lăn / chụm để thu phóng</div><div class="legend"><span><i class="dot"></i>Đã ghé thăm</span><span><i class="dot gray"></i>Chưa khám phá</span><span>◎ Vị trí hiện tại</span></div><div class="tools"><button id="plus" aria-label="Phóng to">＋</button><button id="minus" aria-label="Thu nhỏ">−</button><button id="locate" aria-label="Về vị trí của bạn">◎</button></div></section></main>
<script>
(()=>{'use strict';if(new URLSearchParams(location.search).has('embed'))document.body.classList.add('embed');const embedded=window.parent!==window;const view=document.getElementById('viewport'),world=document.getElementById('world'),label=document.getElementById('currentLabel');let x=-90,y=-70,scale=.78,drag=false,sx=0,sy=0,ox=0,oy=0,pointers=new Map(),pinchStart=0,pinchScale=1;
const key='avp_learning_map_last_location_v1',visitedKey='avp_learning_map_visited_v1';let visited=[];try{visited=JSON.parse(localStorage.getItem(visitedKey)||'[]')}catch(_){}
function apply(){world.style.transform='translate('+x+'px,'+y+'px) scale('+scale+')'}
function center(){const r=view.getBoundingClientRect();x=(r.width-1500*scale)/2;y=(r.height-1050*scale)/2;apply()}
function mark(id){const n=document.querySelector('[data-id="'+id+'"]');if(!n)return;document.querySelectorAll('.node').forEach(v=>v.classList.remove('current'));n.classList.add('current');label.textContent=n.querySelector('b').textContent+' · Hành trình của bạn';if(!visited.includes(id))visited.push(id);try{localStorage.setItem(visitedKey,JSON.stringify(visited));localStorage.setItem(key,id)}catch(_){}document.querySelectorAll('.node').forEach(v=>v.classList.toggle('done',visited.includes(v.dataset.id)&&v.dataset.id!==id));const path=document.getElementById('progressPath');path.style.strokeDasharray=Math.min(visited.length*110,1500)+' 9999'}
let last='home';try{last=localStorage.getItem(key)||'home'}catch(_){}mark(last);
document.querySelectorAll('.node').forEach(n=>n.addEventListener('click',()=>{mark(n.dataset.id);if(embedded){parent.postMessage({type:'AVP_MAP_NAVIGATE',url:n.dataset.url,id:n.dataset.id},location.origin)}else{try{localStorage.setItem('avp_map_mini_enabled_v1','1')}catch(_){}location.href=n.dataset.url}}));
view.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});view.setPointerCapture(e.pointerId);if(pointers.size===1){drag=true;view.classList.add('dragging');sx=e.clientX;sy=e.clientY;ox=x;oy=y}else if(pointers.size===2){drag=false;const a=[...pointers.values()];pinchStart=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);pinchScale=scale}});
view.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&drag){x=ox+e.clientX-sx;y=oy+e.clientY-sy;apply()}else if(pointers.size===2){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);scale=Math.max(.38,Math.min(1.5,pinchScale*d/(pinchStart||d)));apply()}});
function end(e){pointers.delete(e.pointerId);if(!pointers.size){drag=false;view.classList.remove('dragging')}else if(pointers.size===1){const p=[...pointers.values()][0];sx=p.x;sy=p.y;ox=x;oy=y;drag=true}}
view.addEventListener('pointerup',end);view.addEventListener('pointercancel',end);
view.addEventListener('wheel',e=>{e.preventDefault();const old=scale;scale=Math.max(.38,Math.min(1.5,scale*(e.deltaY<0?1.1:.9)));const r=view.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;x=px-(px-x)*scale/old;y=py-(py-y)*scale/old;apply()},{passive:false});
function zoom(f){const r=view.getBoundingClientRect(),px=r.width/2,py=r.height/2,old=scale;scale=Math.max(.38,Math.min(1.5,scale*f));x=px-(px-x)*scale/old;y=py-(py-y)*scale/old;apply()}
document.getElementById('plus').onclick=()=>zoom(1.18);document.getElementById('minus').onclick=()=>zoom(.84);document.getElementById('locate').onclick=()=>{const n=document.querySelector('.node.current');if(n){const nx=parseFloat(n.style.left)+90,ny=parseFloat(n.style.top)+46,r=view.getBoundingClientRect();x=r.width/2-nx*scale;y=r.height/2-ny*scale;apply()}};document.getElementById('home').onclick=()=>location.href='index.html';window.addEventListener('resize',()=>{if(!x&&!y)center()});center();mark(last);document.getElementById('locate').click();
})();
</script></body></html>
