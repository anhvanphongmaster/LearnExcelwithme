<main class="ql-wrap"><header class="ql-head"><span class="ql-kicker">HỌC NHANH MỖI NGÀY</span><h1>2–3 phút, một kỹ năng dùng được ngay</h1><p>Không cần học cả bài dài. Mỗi ngày chọn một mẹo Excel nhỏ, xem ví dụ, làm thử ngay trên file của bạn rồi quay lại công việc.</p></header><article class="ql-card" id="quickLesson" aria-live="polite"></article></main>
<script>(function(){'use strict';function todayVN(){try{return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}catch(_){return new Date().toISOString().slice(0,10)}}function addDays(date,n){const p=date.split('-').map(Number),d=new Date(Date.UTC(p[0],p[1]-1,p[2]+n));return d.toISOString().slice(0,10)}function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function render(){const today=todayVN(),data=window.AVP_QUICK_LESSONS||{},item=data[today],el=document.getElementById('quickLesson');if(!item){el.innerHTML='<h2>Hôm nay chưa có bài</h2><p class="ql-outcome">Bài học mới sẽ được cập nhật cho ngày hôm nay.</p>';return}const nextDate=addDays(today,1);el.innerHTML='<div class="ql-meta"><span class="ql-pill">'+escapeHtml(item.tag)+'</span><span class="ql-pill">2–3 PHÚT</span><span class="ql-pill">'+today+'</span></div><h2>'+escapeHtml(item.title)+'</h2><p class="ql-outcome">'+escapeHtml(item.outcome)+'</p><div class="ql-grid"><section class="ql-panel"><h3>Làm nhanh</h3><ol>'+item.steps.map(function(x){return '<li>'+escapeHtml(x)+'</li>'}).join('')+'</ol><code class="ql-code">'+escapeHtml(item.code)+'</code></section><section class="ql-panel"><h3>Thử ngay</h3><p style="margin:0;color:#566b62;font-size:12px;line-height:1.7">'+escapeHtml(item.task)+'</p></section></div><div class="ql-task"><strong>Mục tiêu hôm nay</strong>Hiểu một thao tác nhỏ và dùng được ngay trong file thật. Không cần học thêm phần nào khác.</div><div class="ql-foot"><a class="ql-back" href="index.html">← Về trang chủ</a><a class="ql-next" href="quick-learn.html?d='+nextDate+'">Bài tiếp theo →</a></div>}render()})();</script>
