<style>
body{background:#f4f7f5;color:#173f2a}
.ql-wrap{max-width:1120px;margin:0 auto;padding:28px 18px 70px}
.ql-head{margin-bottom:18px;padding:24px 26px;border:1px solid #d5e3dc;border-radius:22px;background:#fff;box-shadow:0 10px 28px rgba(23,70,43,.06)}
.ql-kicker{display:block;color:#2e78a1;font-size:11px;font-weight:950;letter-spacing:.12em}
.ql-head h1{margin:6px 0 7px;font-size:clamp(28px,4vw,42px);line-height:1.08;color:#173f2a}
.ql-head p{margin:0;max-width:760px;color:#607168;font-size:14px;line-height:1.65}
.ql-card{position:relative;overflow:hidden;border:1px solid #b9d6e4;border-radius:24px;background:linear-gradient(145deg,#e5f3f9 0%,#fff 62%);box-shadow:0 16px 36px rgba(33,83,110,.11);padding:26px}
.ql-card:before{content:"";position:absolute;right:-80px;top:-90px;width:220px;height:220px;border-radius:50%;background:rgba(46,120,161,.08)}
.ql-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;position:relative}
.ql-pill{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:#fff;border:1px solid #c9dee8;color:#2b6887;font-size:10px;font-weight:900}
.ql-card h2{position:relative;margin:0;color:#1b5677;font-size:clamp(25px,3vw,32px);line-height:1.18;max-width:800px}
.ql-outcome{position:relative;margin:10px 0 22px;color:#566b62;font-size:14px;line-height:1.7;max-width:850px}
.ql-grid{position:relative;display:grid;grid-template-columns:1.08fr .92fr;gap:16px}
.ql-panel{padding:18px;border:1px solid #d8e5e0;border-radius:17px;background:rgba(255,255,255,.82)}
.ql-panel h3{margin:0 0 11px;color:#244d38;font-size:14px}
.ql-panel ol{margin:0;padding-left:21px;color:#566b62;font-size:13px;line-height:1.85}
.ql-panel li+li{margin-top:3px}
.ql-code{display:block;margin-top:14px;padding:14px 15px;border-radius:12px;background:#173f2a;color:#fff;font:600 13px/1.5 Consolas,monospace;overflow:auto}
.ql-task{margin-top:16px;padding:15px 17px;border-radius:15px;background:#fff7e9;border:1px solid #eed9ad;color:#704b12;font-size:13px;line-height:1.65}
.ql-task strong{display:block;margin-bottom:4px;color:#704b12}
.ql-tip{margin-top:10px;padding:12px 14px;border-radius:12px;background:#eef6fa;border:1px dashed #bdd7e4;color:#355f74;font-size:12px;line-height:1.6}
.ql-foot{position:relative;display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:18px}
.ql-back,.ql-next{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 16px;border-radius:11px;text-decoration:none;font-size:12px;font-weight:900}
.ql-back{border:1px solid #cbdcd2;background:#fff;color:#24543a}
.ql-next{background:#2e78a1;color:#fff;box-shadow:0 6px 15px rgba(46,120,161,.16)}
@media(max-width:760px){
  .ql-wrap{padding:20px 12px 48px}
  .ql-head{padding:20px 18px}
  .ql-card{padding:18px}
  .ql-grid{grid-template-columns:1fr}
  .ql-foot{align-items:stretch;flex-direction:column}
  .ql-back,.ql-next{width:100%}
}

<main class="ql-wrap">
<header class="ql-head">
  <span class="ql-kicker">HỌC NHANH MỖI NGÀY</span>
  <h1>2–3 phút, một kỹ năng dùng được ngay</h1>
  <p>Mỗi ngày chọn một mẹo Excel nhỏ, xem cách làm, thử ngay trên file thật và quay lại công việc.</p>
</header>
<article class="ql-card" id="quickLesson" aria-live="polite"></article>
</main>

<script>
(function(){
'use strict';
function todayVN(){
  try{return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
  catch(_){return new Date().toISOString().slice(0,10)}
}
function addDays(date,n){
  const p=date.split('-').map(Number), d=new Date(Date.UTC(p[0],p[1]-1,p[2]+n));
  return d.toISOString().slice(0,10)
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})
}
function getRequestedDate(){
  const raw=new URLSearchParams(location.search).get('d');
  return /^\d{4}-\d{2}-\d{2}$/.test(raw||'') ? raw : todayVN();
}
function render(){
  const date=getRequestedDate(), data=window.AVP_QUICK_LESSONS||{}, item=data[date], el=document.getElementById('quickLesson');
  if(!item){
    el.innerHTML='<h2>Hôm nay chưa có bài</h2><p class="ql-outcome">Bài học mới sẽ được cập nhật.</p><div class="ql-foot"><a class="ql-back" href="index.html">← Về trang chủ</a></div>';
    return;
  }
  const prevDate=addDays(date,-1), nextDate=addDays(date,1);
  const hasPrev=!!data[prevDate], hasNext=!!data[nextDate];
  el.innerHTML=
    '<div class="ql-meta">'+
      '<span class="ql-pill">'+escapeHtml(item.tag)+'</span>'+
      '<span class="ql-pill">2–3 PHÚT</span>'+
      '<span class="ql-pill">'+date+'</span>'+
    '</div>'+
    '<h2>'+escapeHtml(item.title)+'</h2>'+
    '<p class="ql-outcome">'+escapeHtml(item.outcome)+'</p>'+
    '<div class="ql-grid">'+
      '<section class="ql-panel"><h3>Làm nhanh</h3><ol>'+
        item.steps.map(function(x){return '<li>'+escapeHtml(x)+'</li>'}).join('')+
      '</ol><code class="ql-code">'+escapeHtml(item.code)+'</code></section>'+
      '<section class="ql-panel"><h3>Thử ngay trên file thật</h3><p style="margin:0;color:#566b62;font-size:13px;line-height:1.75">'+escapeHtml(item.task)+'</p>'+
        '<div class="ql-tip"><strong>Gợi ý:</strong> đừng chỉ đọc — làm đúng một lần trên dữ liệu bạn đang xử lý.</div>'+
      '</section>'+
    '</div>'+
    '<div class="ql-task"><strong>Mục tiêu hôm nay</strong>Hiểu một thao tác nhỏ và dùng được ngay trong công việc.</div>'+
    '<div class="ql-foot">'+
      '<a class="ql-back" href="index.html">← Về trang chủ</a>'+
      (hasPrev ? '<a class="ql-back" href="quick-learn.html?d='+prevDate+'">← Bài trước</a>' : '<span></span>')+
      (hasNext ? '<a class="ql-next" href="quick-learn.html?d='+nextDate+'">Bài tiếp theo →</a>' : '<span></span>')+
    '</div>';
}
render();
})();
</script>
