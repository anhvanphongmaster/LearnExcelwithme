<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Excel Race | Learn Excel with Anh Van Phong</title>
  <link rel="stylesheet" href="excel-race.css?v=20260827" />
<link rel="stylesheet" href="avp-core.css" />
</head>
<body>
  <div class="race-wrap">
    <header class="race-top">
      <a href="index.html">← Trang chủ</a>
      <span class="tag">2.5D · 2000 câu</span>
    </header>

    <div class="name-row" id="nameRow">
      <label>Tên trên BXH</label>
      <input id="playerName" type="text" maxlength="20" readonly autocomplete="off" placeholder="Đăng nhập để lấy tên" />
      <span id="nameStatus" class="name-status"></span>
      <p class="name-gate-msg" id="nameGateMsg">Đăng nhập để chơi. Tên lấy từ tài khoản, không cần khóa tên.</p>
    </div>

    <div class="mode-row" id="modeRow">
      <button type="button" class="mode active" data-mode="hoc" id="modeHoc">📚 Học — sai về đầu cấp <small style="opacity:.85;font-weight:700">(không lên BXH)</small></button>
      <button type="button" class="mode" data-mode="rank" id="modeRank"><span class="rank-hot">🏆 RANK — ĐUA XẾP HẠNG</span> <small class="rank-sub">sai về cấp 1 · tính BXH</small></button>
    </div>

    <button type="button" class="board-jump" id="boardJump">🏆 Xem bảng xếp hạng ↓</button>

    <div class="hud">
      <div><small>Cấp</small><b id="lv">1</b></div>
      <div><small>Câu</small><b id="pg">0/30</b></div>
      <div><small>Chuỗi</small><b id="st">0</b></div>
      <div><small>Kỷ lục</small><b id="best">0</b></div>
      <div><small>Giờ</small><b id="sec">20</b></div>
      <div><small>Mạng</small><b id="lives">—</b></div>
    </div>
    <div class="timer"><i id="fill"></i></div>
    <div id="countOverlay" class="count-overlay" hidden>
      <div class="count-num" id="countNum">3</div>
      <div class="count-sub">Sẵn sàng…</div>
    </div>
    <canvas id="cv" width="900" height="360" aria-label="Đường đua"></canvas>

    <section class="panel">
      <p class="msg" id="msg">Đăng nhập → chọn Học hoặc Rank → Bắt đầu. Tên BXH lấy từ tài khoản.</p>
      <p class="q" id="q" hidden></p>
      <div class="ans" id="ans" hidden>
        <button type="button" id="a1"></button>
        <button type="button" id="a2"></button>
      </div>
      <div class="hint" id="hint" hidden>
        <span>Ôn thêm:</span>
        <a id="hintLink" href="practice-video.html">Bài tập theo video</a>
      </div>
      <div class="race-go-row">
        <button type="button" class="go" id="start">Bắt đầu</button>
        <button type="button" class="stop-race" id="stopRace" hidden>⏹ Dừng</button>
      </div>
    </section>

    <section class="board" id="board">
      <div class="board-h">
        <strong>Bảng xếp hạng</strong>
        <span style="display:flex;gap:6px;align-items:center">
        <button type="button" id="resetLocalBest" class="board-ref" title="Xóa kỷ lục trên máy này">Reset máy</button>
        <button type="button" id="boardRefresh" class="board-ref">Làm mới</button>
      </span>
      </div>
      <ol id="boardList" class="board-list"><li class="muted">Đang tải…</li></ol>
    </section>
  </div>

  <div id="avpModal" class="avp-modal" hidden>
    <div class="avp-modal-backdrop" data-avp-close></div>
    <div class="avp-modal-card" role="dialog" aria-modal="true" aria-labelledby="avpModalTitle">
      <div class="avp-modal-icon" id="avpModalIcon">📊</div>
      <h3 class="avp-modal-title" id="avpModalTitle">Thông báo</h3>
      <p class="avp-modal-body" id="avpModalBody"></p>
      <div class="avp-modal-actions">
        <button type="button" class="avp-modal-btn avp-modal-cancel" id="avpModalCancel" hidden>Hủy</button>
        <button type="button" class="avp-modal-btn avp-modal-ok" id="avpModalOk">OK</button>
      </div>
    </div>
  </div>

  <script src="excel-race-questions.js"></script>
  <script src="supabase-config.js"></script>
  <script type="module" src="supabase-auth.js"></script>
  <script defer src="analytics-tracker.js"></script>
  <script defer src="excel-race.js?v=20260827b"></script>
<script defer src="avp-core.js"></script>
<script defer src="avp-modal.js"></script>
</body>
</html>
