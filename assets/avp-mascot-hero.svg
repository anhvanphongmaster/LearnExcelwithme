<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 710" role="img" aria-labelledby="title desc">
<title id="title">AVP Data mascot</title><desc id="desc">Nhân vật Anh Văn Phòng đeo kính và tai nghe xanh, làm việc với laptop Excel trước nền dữ liệu và biểu đồ.</desc>
<defs>
 <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f4faf6"/></linearGradient>
 <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#075b3d"/><stop offset="1" stop-color="#052b20"/></linearGradient>
 <linearGradient id="green" x2="1" y2="1"><stop stop-color="#42d878"/><stop offset="1" stop-color="#078348"/></linearGradient>
 <linearGradient id="hair" x2=".8" y2="1"><stop stop-color="#42434c"/><stop offset=".45" stop-color="#171820"/><stop offset="1" stop-color="#090d13"/></linearGradient>
 <linearGradient id="shirt" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e6f0eb"/></linearGradient>
 <linearGradient id="laptop" x2="1" y2="1"><stop stop-color="#8799ad"/><stop offset="1" stop-color="#40566d"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="14"/></filter>
 <filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#123d2a" flood-opacity=".16"/></filter>
</defs>
