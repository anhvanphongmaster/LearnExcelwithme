<script>
(function(){
const chapters=[
{title:"Nhập môn Excel",icon:"▤",desc:"Giao diện Excel, workbook, worksheet, ô và vùng dữ liệu, kiểu dữ liệu, định dạng và quản lý file."},
{title:"Thao tác và phím tắt",icon:"⌨",desc:"Di chuyển, chọn vùng, nhập liệu, chỉnh sửa, định dạng, quản lý bảng và thao tác nhanh theo tình huống."},
{title:"Nền tảng công thức",icon:"ƒx",desc:"Toán tử, thứ tự tính, tham chiếu tương đối, tuyệt đối và hỗn hợp, sao chép công thức và xử lý lỗi."},
{title:"Hàm Excel từ cơ bản đến nâng cao",icon:"ƒ",desc:"Hệ thống hàm Excel từ tính toán, thống kê, logic, điều kiện, tra cứu đến văn bản, ngày giờ, mảng động và công thức lồng nhau."},
{title:"Công cụ xử lý dữ liệu trên Ribbon",icon:"⌕",desc:"Sort, Filter, Find & Replace, Remove Duplicates, Text to Columns, Flash Fill, Data Validation và Conditional Formatting."},
{title:"Tổ chức và kiểm soát dữ liệu",icon:"▦",desc:"Excel Table, quy tắc dữ liệu, khóa định danh, dữ liệu trùng hoặc thiếu, chuẩn hóa và kiểm tra tính nhất quán."},
{title:"PivotTable và PivotChart",icon:"▥",desc:"Tạo bảng tổng hợp, bố trí trường, tính toán, Group, lọc, Refresh, Slicer, Timeline và PivotChart."},
{title:"Biểu đồ và Dashboard",icon:"▧",desc:"Chọn biểu đồ theo mục đích, định dạng, KPI, biểu đồ kết hợp, tương tác và thiết kế báo cáo trực quan."},
{title:"Power Query",icon:"↻",desc:"Kết nối nguồn, làm sạch, biến đổi, Merge, Append, Unpivot, Combine Files, M Code, Refresh và tối ưu hiệu năng."},
{title:"Phân tích dữ liệu",icon:"⌁",desc:"Xác định câu hỏi, xây dựng chỉ số, so sánh, xu hướng, chênh lệch, Pareto, tìm nguyên nhân và diễn giải kết quả."},
{title:"Tự động hóa Excel",icon:"⚙",desc:"Dynamic Arrays, LET, LAMBDA, VBA/Macro và lựa chọn phương pháp tự động hóa phù hợp với phiên bản Excel."},
{title:"Quy trình báo cáo doanh nghiệp",icon:"✓",desc:"Tiếp nhận yêu cầu, xử lý nguồn, đối soát, xây dựng báo cáo, kiểm thử, bàn giao và thiết kế quy trình cập nhật định kỳ."}
