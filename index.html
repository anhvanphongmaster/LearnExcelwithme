<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn Excel with Anh Van Phong</title>
<meta name="robots" content="index,follow">
<style>html,body{margin:0;background:#071810;color:#e8f5ec;font-family:Arial,sans-serif}#avpRestore{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}#avpRestore p{opacity:.8}</style>
</head>
<body>
<div id="avpRestore"><p>Đang tải trang chủ…</p></div>
<script>
(function(){
  var urls=[
    'https://cdn.jsdelivr.net/gh/anhvanphongmaster/LearnExcelwithme@194140a1ccda8a748b7673bee585b3c25228590b/index.html',
    'https://raw.githubusercontent.com/anhvanphongmaster/LearnExcelwithme/194140a1ccda8a748b7673bee585b3c25228590b/index.html'
  ];
  function paint(html){
    document.open();
    document.write(html);
    document.close();
  }
  function next(i){
    if(i>=urls.length){
      document.getElementById('avpRestore').innerHTML='<p>Không tải được trang chủ. Thử tải lại.</p>';
      return;
    }
    fetch(urls[i],{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text()}).then(paint).catch(function(){next(i+1)});
  }
  next(0);
})();
</script>
</body>
</html>
